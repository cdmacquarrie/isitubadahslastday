*{box-sizing:border-box}

.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;

var ENT={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ENT[c];}); }
function fmt(v,dp){ return (v==null||!isFinite(v))?'--':v.toFixed(dp==null?1:dp); }
function pct(v){ return (v==null||!isFinite(v))?'--':(v*100).toFixed(1); }

var HIGH=(BB.current&&BB.current.cats_high)||[];
var LOW=(BB.current&&BB.current.cats_low)||[];
var CATS=HIGH.concat(LOW);

/* One category compared between two teams. Returns 1, -1 or 0. The direction
   set was fitted against the league's own recorded results and reproduces
   them exactly on every completed week, so this is the real scoring rule
   rather than a guess at it. */
function cmpCat(cat, a, b){
  if(a==null||b==null){ return null; }
  if(a===b){ return 0; }
  var higherWins = HIGH.indexOf(cat)>=0;
  return (a>b)===higherWins ? 1 : -1;
}

function analyse(){
  var cur=BB.current;
  if(!cur){ return []; }
  var through=cur.complete_through||0;
  var T={};
  cur.teams.forEach(function(t){
    T[t]={team:t,w:0,l:0,t_:0,cw:0,cl:0,ct:0,apCw:0,apCl:0,apCt:0,
          apW:0,apL:0,apT:0,byWeek:{},cats:{},weeks:0};
    CATS.forEach(function(c){ T[t].cats[c]={w:0,l:0,t:0}; });
  });

  cur.weeks.forEach(function(wk){
    if(wk.w>through){ return; }
    var live=wk.entries.filter(function(e){ return e.done; });
    var byTeam={};
    live.forEach(function(e){ byTeam[e.t]=e; });

    live.forEach(function(e){
      var me=T[e.t], opp=byTeam[e.o];
      if(!me||!opp){ return; }
      me.weeks++;
      var w=0,l=0,t=0;
      CATS.forEach(function(c){
        var r=cmpCat(c,e.c[c],opp.c[c]);
        if(r===null){ return; }
        if(r>0){ w++; } else if(r<0){ l++; } else { t++; }
      });
      me.cw+=w; me.cl+=l; me.ct+=t;
      me.byWeek[wk.w]=w;
      if(w>l){ me.w++; } else if(l>w){ me.l++; } else { me.t_++; }

      /* All-play: the same week scored against every other team, not just
         the one the schedule paired us with. */
      live.forEach(function(other){
        if(other.t===e.t){ return; }
        var aw=0,al=0;
        CATS.forEach(function(c){
          var r=cmpCat(c,e.c[c],other.c[c]);
          if(r===null){ return; }
          if(r>0){ aw++; me.cats[c].w++; }
          else if(r<0){ al++; me.cats[c].l++; }
          else { me.cats[c].t++; }
        });
        me.apCw+=aw; me.apCl+=al;
        if(aw>al){ me.apW++; } else if(al>aw){ me.apL++; } else { me.apT++; }
      });
    });
  });

  var rows=cur.teams.map(function(t){
    var r=T[t];
    var g=r.w+r.l+r.t_;
    r.pct=g?(r.w+r.t_/2)/g:0;
    var cg=r.cw+r.cl+r.ct;
    r.catPct=cg?(r.cw+r.ct/2)/cg:0;
    var ap=r.apW+r.apL+r.apT;
    r.apPct=ap?(r.apW+r.apT/2)/ap:0;
    r.luck=r.pct-r.apPct;
    return r;
  }).filter(function(r){ return r.weeks>0; });
  rows.sort(function(a,b){ return b.pct-a.pct || b.catPct-a.catPct; });
  rows.forEach(function(r,i){ r.rank=i+1; });
  return rows;
}

/* ------------------------------------------------------------------ charts */
function chartWeeklyCats(rows, through){
  var W=1080,H=320,L=44,R=140,T=16,B=38,IW=W-L-R,IH=H-T-B;
  var hi=CATS.length;
  var x=function(w){ return L+IW*(through<2?0.5:(w-1)/(through-1)); };
  var y=function(v){ return T+IH*(1-v/hi); };
  var out=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Categories won by week">'];
  for(var k=0;k<=4;k++){
    var gy=T+IH*k/4, val=hi*(1-k/4);
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+
             '" stroke="var(--grid)"/>');
    out.push('<text x="'+(L-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="11" '+
             'fill="var(--muted)">'+val.toFixed(0)+'</text>');
  }
  for(var w=1;w<=through;w++){
    if(through<=20||w%2===1){
      out.push('<text x="'+x(w).toFixed(1)+'" y="'+(T+IH+16)+'" text-anchor="middle" '+
               'font-size="11" fill="var(--muted)">'+w+'</text>');
    }
  }
  rows.forEach(function(r){
    var pts=[];
    for(var w=1;w<=through;w++){ if(r.byWeek[w]!=null){ pts.push(x(w).toFixed(1)+','+y(r.byWeek[w]).toFixed(1)); } }
    if(pts.length){
      out.push('<polyline fill="none" stroke="var(--muted)" stroke-width="1.1" opacity=".3" points="'+
               pts.join(' ')+'"/>');
    }
  });
  var med=[];
  for(w=1;w<=through;w++){
    var v=rows.map(function(r){return r.byWeek[w];}).filter(function(z){return z!=null;}).sort(function(a,b){return a-b;});
    if(v.length){ med.push([w,v[Math.floor(v.length/2)]]); }
  }
  if(med.length){
    out.push('<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="'+
             med.map(function(p){return x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1);}).join(' ')+'"/>');
    out.push('<text x="'+(L+IW+8)+'" y="'+(y(med[med.length-1][1])+4).toFixed(1)+
             '" font-size="11" fill="var(--accent)" font-weight="600">league median</text>');
  }
  out.push('<text x="'+(L+IW/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="12" '+
           'fill="var(--muted)">Week</text>');
  out.push('</svg>');
  return out.join('');
}

/* ---------------------------------------------------------------- sections */
var SECTIONS=[];
function sect(id,title,note,body){
  SECTIONS.push([id,title]);
  return '<section id="'+id+'"><h2>'+esc(title)+'</h2><p class="note">'+note+'</p>'+body+'</section>';
}

function overview(rows){
  var cur=BB.current;
  var top=rows[0];
  var bestCat=rows.slice().sort(function(a,b){return b.catPct-a.catPct;})[0];
  var lucky=rows.slice().sort(function(a,b){return b.luck-a.luck;})[0];
  var unlucky=rows.slice().sort(function(a,b){return a.luck-b.luck;})[0];
  var champs=(BB.alltime||[]).slice().sort(function(a,b){return (b.titles||0)-(a.titles||0);})[0];
  var cards=[
    ['Top of the table', top.team, top.w+'-'+top.l+'-'+top.t_+' through week '+cur.complete_through],
    ['Best category rate', bestCat.team, pct(bestCat.catPct)+'% of categories won'],
    ['Best served by the schedule', lucky.team, (lucky.luck>=0?'+':'')+pct(lucky.luck)+' pts of win% over all-play'],
    ['Worst served', unlucky.team, pct(unlucky.luck)+' pts of win% under all-play']
  ];
  if(champs && champs.titles){
    cards.push(['Most titles', champs.team, champs.titles+' in '+champs.seasons+' seasons']);
  }
  return sect('overview','Overview','What this covers and how to read it.',
    '<p class="lead">'+esc(BB.league)+', '+esc(cur.label)+', '+cur.teams.length+
    ' teams, complete through week '+cur.complete_through+'. Scoring is head-to-head '+
    'by category: each week is '+CATS.length+' separate contests, and the team winning '+
    'more of them takes the week. That makes the fixture list matter, so the table is '+
    'read against an all-play record throughout &mdash; what each team would have done '+
    'against every opponent, every week.</p>'+
    '<div class="cards">'+cards.map(function(c){
      return '<div class="card"><div class="label">'+esc(c[0])+'</div><div class="val">'+
             esc(c[1])+'</div><div class="why">'+esc(c[2])+'</div></div>';
    }).join('')+'</div>');
}

function standings(rows){
  var body=rows.map(function(r){
    return '<tr><td class="name">'+esc(r.team)+'</td><td>'+r.rank+'</td>'+
      '<td data-sort="'+r.pct+'">'+r.w+'-'+r.l+'-'+r.t_+'</td>'+
      '<td data-sort="'+r.pct+'">'+pct(r.pct)+'</td>'+
      '<td data-sort="'+r.cw+'">'+r.cw+'-'+r.cl+'-'+r.ct+'</td>'+
      '<td data-sort="'+r.catPct+'">'+pct(r.catPct)+'</td>'+
      '<td data-sort="'+r.apPct+'">'+pct(r.apPct)+'</td></tr>';
  }).join('');
  return sect('standings','Standings',
    'Weeks won and lost, then the underlying category record. All-play win% is the '+
    'same season with every team meeting every other team each week.',
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th><th>#</th>'+
    '<th>W-L-T</th><th>Win%</th><th>Cats W-L-T</th><th>Cat%</th><th>All-play%</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>');
}

function luck(rows){
  var sorted=rows.slice().sort(function(a,b){return b.luck-a.luck;});
  var span=Math.max.apply(null,sorted.map(function(r){return Math.abs(r.luck);}))||0.01;
  var body=sorted.map(function(r){
    var wdt=46*Math.abs(r.luck)/span, left=r.luck<0?50-wdt:50;
    var col=r.luck>=0?'var(--accent)':'var(--warm)';
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+r.luck+'"><span class="diverge"><i style="left:'+left.toFixed(1)+
      '%;width:'+Math.max(wdt,1).toFixed(1)+'%;background:'+col+'"></i><span class="mid"></span></span></td>'+
      '<td data-sort="'+r.luck+'">'+(r.luck>=0?'+':'')+pct(r.luck)+'</td>'+
      '<td data-sort="'+r.pct+'">'+pct(r.pct)+'</td>'+
      '<td data-sort="'+r.apPct+'">'+pct(r.apPct)+'</td></tr>';
  }).join('');
  return sect('luck','Record against the schedule',
    'A week is won by taking more categories than one particular opponent, and who '+
    'that opponent was each week is nobody&rsquo;s doing. Green means the record runs '+
    'ahead of what the same category lines would have earned against the whole field; '+
    'warm means the draw has cost something.',
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th>'+
    '<th>Schedule effect</th><th>Gap</th><th>Actual win%</th><th>All-play win%</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>');
}

function categories(rows){
  function shade(v){
    // One hue, lightness carrying the value, so the grid reads as a gradient
    // rather than as a set of unrelated colours.
    var t=Math.max(0,Math.min(1,v));
    var l=92-40*t;
    return 'hsl(150 38% '+l.toFixed(0)+'%)';
  }
  var head='<tr><th>Team</th>'+CATS.map(function(c){
    return '<th title="'+(LOW.indexOf(c)>=0?'lower is better':'higher is better')+'">'+esc(c)+'</th>';
  }).join('')+'</tr>';
  var body=rows.map(function(r){
    var cells=CATS.map(function(c){
      var d=r.cats[c], n=d.w+d.l+d.t;
      if(!n){ return '<td class="c dim">--</td>'; }
      var v=(d.w+d.t/2)/n;
      return '<td class="c" style="background:'+shade(v)+'" title="'+esc(c)+': '+
             d.w+'-'+d.l+'-'+d.t+'">'+(v*100).toFixed(0)+'</td>';
    }).join('');
    return '<tr><td class="name">'+esc(r.team)+'</td>'+cells+'</tr>';
  }).join('');
  return sect('categories','Category profile',
    'Share of category contests won, measured against every opponent every week '+
    'rather than only the scheduled one, so a soft schedule cannot flatter a '+
    'category. Darker is stronger. ERA and WHIP are won by the lower number; '+
    'everything else by the higher.',
    '<div class="scroll"><table class="heat"><thead>'+head+'</thead><tbody>'+body+
    '</tbody></table></div>');
}

function weekly(rows){
  return sect('weekly','Categories won by week',
    'Out of '+CATS.length+' each week, every team faintly with the league median '+
    'through the middle.',
    chartWeeklyCats(rows, BB.current.complete_through));
}

function history(){
  var h=BB.history||[];
  if(!h.length){ return ''; }
  var seasons=[]; h.forEach(function(r){ if(seasons.indexOf(r.season)<0){ seasons.push(r.season); } });
  seasons.sort();
  var teams={};
  h.forEach(function(r){ (teams[r.team]=teams[r.team]||{})[r.season]=r; });
  var names=Object.keys(teams).sort(function(a,b){
    var la=h.filter(function(r){return r.team===a;}).length;
    var lb=h.filter(function(r){return r.team===b;}).length;
    return lb-la || a.localeCompare(b);
  });
  var head='<tr><th>Team</th>'+seasons.map(function(s){return '<th>'+esc(s)+'</th>';}).join('')+'</tr>';
  var body=names.map(function(n){
    var cells=seasons.map(function(s){
      var r=teams[n][s];
      if(!r){ return '<td class="dim">--</td>'; }
      var badge=r.champion?' <span class="pill gold">champ</span>':
                (r.reg_champ?' <span class="pill">reg</span>':'');
      var label=r.finish? r.finish+' of '+r.of : '--';
      if(r.status && r.status!=='complete'){ label+=' *'; }
      return '<td data-sort="'+(r.finish||99)+'">'+label+badge+'</td>';
    }).join('');
    return '<tr><td class="name">'+esc(n)+'</td>'+cells+'</tr>';
  }).join('');
  return sect('history','Finishes by season',
    'Where each team ended up. A star marks a season still in progress; '+
    '&ldquo;reg&rdquo; is the regular-season title and &ldquo;champ&rdquo; the playoff one.',
    '<div class="scroll"><table class="sortable"><thead>'+head+'</thead><tbody>'+body+
    '</tbody></table></div>');
}

function alltime(){
  var a=BB.alltime||[];
  if(!a.length){ return ''; }
  var rows=a.slice().sort(function(x,y){ return (y.win_pct||0)-(x.win_pct||0); });
  var body=rows.map(function(r){
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td>'+(r.seasons||'--')+'</td>'+
      '<td data-sort="'+(r.cw||0)+'">'+fmt(r.cw,0)+'-'+fmt(r.cl,0)+'-'+fmt(r.ct,0)+'</td>'+
      '<td data-sort="'+(r.win_pct||0)+'">'+pct(r.win_pct)+'</td>'+
      '<td data-sort="'+(r.avg_finish||99)+'">'+fmt(r.avg_finish,2)+'</td>'+
      '<td data-sort="'+(r.best_finish||99)+'">'+fmt(r.best_finish,0)+'</td>'+
      '<td data-sort="'+(r.reg_titles||0)+'">'+fmt(r.reg_titles,0)+'</td>'+
      '<td data-sort="'+(r.titles||0)+'">'+
        (r.titles? '<span class="pill gold">'+fmt(r.titles,0)+'</span>':'0')+'</td></tr>';
  }).join('');
  return sect('alltime','All-time',
    'Career category record across every season on file, including the one in '+
    'progress. Win% is category wins plus half the ties.',
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th><th>Seasons</th>'+
    '<th>Cats W-L-T</th><th>Win%</th><th>Avg finish</th><th>Best</th><th>Reg titles</th>'+
    '<th>Titles</th></tr></thead><tbody>'+body+'</tbody></table></div>');
}

function method(){
  var cur=BB.current;
  var unnamed=cur.teams.filter(function(t){ return /^Unnamed team/.test(t); });
  var extra = unnamed.length?
    '<tr><td class="name">Unnamed teams</td><td style="text-align:left">'+
    unnamed.length+' team'+(unnamed.length>1?'s have':' has')+
    ' no team name in any export on file, so '+(unnamed.length>1?'they are':'it is')+
    ' shown by placeholder rather than by the manager&rsquo;s name.</td></tr>' : '';
  return sect('method','Method and glossary','Where the numbers come from.',
    '<p class="note">Built from the league&rsquo;s Yahoo exports and the season history '+
    'the notebooks compute: '+(BB.history||[]).length+' season records, '+
    (BB.alltime||[]).length+' career rows, and '+cur.weeks.length+' weeks of the '+
    cur.label+' season.</p>'+
    '<div class="scroll"><table><tbody>'+
    [['Categories', CATS.length+' per week: '+CATS.join(', ')+'. ERA and WHIP are won '+
      'by the lower number. The set and its directions were fitted against the '+
      'league&rsquo;s own recorded results and reproduce them exactly on every '+
      'completed week.'],
     ['Cat%','Category contests won plus half the ties, against the scheduled opponent.'],
     ['All-play win%','The record a team would hold facing every other team every '+
      'week rather than the one the schedule gave it.'],
     ['Schedule effect','Actual win% minus all-play win%.'],
     ['Team names','Managers are aliased to the most recent team name they can be '+
      'matched to. The 2026 exports name every team after its manager, so those '+
      'names come from earlier seasons. Manager names and emails stay in the '+
      'private data.']
    ].map(function(g){
      return '<tr><td class="name" style="width:170px">'+g[0]+'</td><td style="text-align:left">'+
             g[1]+'</td></tr>';
    }).join('')+extra+'</tbody></table></div>');
}

function wireSort(){
  document.querySelectorAll('table.sortable').forEach(function(table){
    table.querySelectorAll('th').forEach(function(head,col){
      head.addEventListener('click',function(){
        var body=table.tBodies[0], rs=Array.prototype.slice.call(body.rows);
        var dir=head.dataset.dir==='asc'?-1:1;
        table.querySelectorAll('th').forEach(function(o){ delete o.dataset.dir; });
        head.dataset.dir=dir===1?'asc':'desc';
        rs.sort(function(l,r){
          var a=l.cells[col]?(l.cells[col].dataset.sort!==undefined?l.cells[col].dataset.sort:l.cells[col].textContent):'';
          var b=r.cells[col]?(r.cells[col].dataset.sort!==undefined?r.cells[col].dataset.sort:r.cells[col].textContent):'';
          var x=parseFloat(a),y=parseFloat(b);
          if(!isNaN(x)&&!isNaN(y)){ return (x-y)*dir; }
          return String(a).localeCompare(String(b))*dir;
        });
        rs.forEach(function(row){ body.appendChild(row); });
      });
    });
  });
}

(function boot(){
  var rows=analyse();
  SECTIONS=[];
  document.getElementById('main').innerHTML=
    (rows.length? overview(rows)+standings(rows)+luck(rows)+categories(rows)+weekly(rows):'')+
    history()+alltime()+method();
  document.getElementById('toc').innerHTML=SECTIONS.map(function(s){
    return '<a href="#'+s[0]+'">'+esc(s[1])+'</a>';
  }).join('');
  var cur=BB.current;
  document.getElementById('subtitle').textContent=
    cur.label+' · '+cur.teams.length+' teams · complete through week '+cur.complete_through+
    ' · '+(BB.history||[]).length+' season records on file';

  var themer=document.getElementById('theme');
  var modes=['auto','light','dark'], at=0;
  try{ at=Math.max(0,modes.indexOf(localStorage.getItem('bbTheme'))); }catch(e){ at=0; }
  function paint(){
    var m=modes[at];
    if(m==='auto'){ document.documentElement.removeAttribute('data-theme'); }
    else { document.documentElement.setAttribute('data-theme',m); }
    themer.textContent='theme: '+m;
    try{ localStorage.setItem('bbTheme',m); }catch(e){}
  }
  paint();
  themer.addEventListener('click',function(){ at=(at+1)%modes.length; paint(); });
  wireSort();
})();
</script>

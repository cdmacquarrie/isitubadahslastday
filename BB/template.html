  --line:#2a2f37; --accent:#6fbf8f; --warm:#d98f6f; --grid:#222730;
  --bat:#7aa9dd; --pit:#d98f6f;

*{box-sizing:border-box}
body{margin:0;padding:0 0 72px;background:var(--bg);color:var(--ink);
 font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

 gap:14px;justify-content:space-between}

<script>
var BB = __BASEBALL_JSON__;

var ENT={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ENT[c];}); }
function fmt(v,dp){ return (v==null||!isFinite(v))?'--':v.toFixed(dp==null?1:dp); }
function pct(v){ return (v==null||!isFinite(v))?'--':(v*100).toFixed(1); }
function mean(a){ return a.length? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }

/* Which half of the game each category belongs to, for the batting/pitching
   split. Anything unlisted is treated as pitching, which is where the odd
   ones (OUT, QS, SV+H) live. */
var BATTING = {R:1,HR:1,RBI:1,SB:1,AVG:1,TB:1,OBP:1};

var ALL='__all__';

function seasonByLabel(label){
  if(label===ALL){ return BB.seasons.slice(); }
  for(var i=0;i<BB.seasons.length;i++){ if(BB.seasons[i].label===label){ return BB.seasons[i]; } }
  return BB.seasons[BB.seasons.length-1];
}

function seasonLabel(season){
  return Array.isArray(season)
    ? season[0].label+' to '+season[season.length-1].label
    : season.label;
}

/* One category compared between two teams: 1, -1 or 0. Each season's set and
   direction were fitted against that season's own recorded category record
   and reproduce it exactly, so this is the scoring rule rather than a guess. */
function cmpCat(season, cat, a, b){
  if(a==null||b==null){ return null; }
  if(a===b){ return 0; }
  return (a>b)===(season.cats_high.indexOf(cat)>=0) ? 1 : -1;
}

function analyse(input){
  /* Takes one season or a list of them. Two things must stay inside their own
     season when combining: all-play, which compares teams within a week, and
     the category set, which changed between 2025 and 2026. Week numbers
     repeat every year, so the per-week maps are only filled for a single
     season. */
  var list = Array.isArray(input) ? input : [input];
  var single = list.length === 1;

  var seen={}, CATS=[];
  list.forEach(function(s){
    s.cats_high.concat(s.cats_low).forEach(function(c){
      if(!seen[c]){ seen[c]=1; CATS.push(c); }
    });
  });

  var T={};
  function slot(t){
    if(!T[t]){
      T[t]={team:t,w:0,l:0,t_:0,cw:0,cl:0,ct:0,apW:0,apL:0,apT:0,
            byWeek:{},catByWeek:{},cats:{},totals:{},h2h:{},weeks:0,
            bestCats:0,bestWeek:null,apByWeek:{},royals:0,seasons:{}};
      CATS.forEach(function(c){ T[t].cats[c]={w:0,l:0,t:0}; T[t].totals[c]=[]; });
    }
    return T[t];
  }

  list.forEach(function(season){
    var cats=season.cats_high.concat(season.cats_low);
    var through=season.complete_through||0;
    season.teams.forEach(slot);

    season.weeks.forEach(function(wk){
      if(wk.w>through){ return; }
      var live=wk.entries.filter(function(e){ return e.done && T[e.t]; });
      var byTeam={}; live.forEach(function(e){ byTeam[e.t]=e; });

      live.forEach(function(e){
        var me=T[e.t], opp=byTeam[e.o];
        me.weeks++;
        me.seasons[season.label]=1;
        cats.forEach(function(c){ if(e.c[c]!=null){ me.totals[c].push(e.c[c]); } });
        if(single){ me.catByWeek[wk.w]=e.c; }

        if(opp){
          var w=0,l=0,t=0;
          cats.forEach(function(c){
            var r=cmpCat(season,c,e.c[c],opp.c[c]);
            if(r===null){ return; }
            if(r>0){ w++; } else if(r<0){ l++; } else { t++; }
          });
          me.cw+=w; me.cl+=l; me.ct+=t;
          if(single){ me.byWeek[wk.w]=w; }
          if(w>me.bestCats){ me.bestCats=w; me.bestWeek=wk.w; }
          if(w>l){ me.w++; me.h2h[e.o]=(me.h2h[e.o]||0)+1; }
          else if(l>w){ me.l++; } else { me.t_++; }
        }

        /* All-play: the same week scored against every other team rather than
           only the one the schedule paired us with. Also where the
           per-category strength comes from, so a soft draw cannot flatter a
           category. */
        var wkW=0, wkL=0;
        live.forEach(function(other){
          if(other.t===e.t){ return; }
          var aw=0,al=0;
          cats.forEach(function(c){
            var r=cmpCat(season,c,e.c[c],other.c[c]);
            if(r===null){ return; }
            if(r>0){ aw++; me.cats[c].w++; }
            else if(r<0){ al++; me.cats[c].l++; }
            else { me.cats[c].t++; }
          });
          if(aw>al){ me.apW++; wkW++; } else if(al>aw){ me.apL++; wkL++; } else { me.apT++; }
        });
        /* A royal week is a week a team would have beaten every other team in
           the league. That is the league's own definition of the weekly
           award, recovered rather than assumed: it reproduces the recorded
           list exactly, week for week and name for name. */
        me.apByWeek[season.label+'|'+wk.w]={w:wkW,l:wkL,n:live.length-1,wk:wk.w};
        if(live.length>1 && wkW===live.length-1){ me.royals++; }
      });
    });
  });

  var rows=Object.keys(T).map(function(t){
    var r=T[t];
    var g=r.w+r.l+r.t_;
    r.pct=g?(r.w+r.t_/2)/g:0;
    var cg=r.cw+r.cl+r.ct;
    r.catPct=cg?(r.cw+r.ct/2)/cg:0;
    var ap=r.apW+r.apL+r.apT;
    r.apPct=ap?(r.apW+r.apT/2)/ap:0;
    r.luck=r.pct-r.apPct;
    r.games=g;
    r.nSeasons=Object.keys(r.seasons).length;
    var bw=0,bn=0,pw=0,pn=0;
    CATS.forEach(function(c){
      var d=r.cats[c], n=d.w+d.l+d.t;
      if(!n){ return; }
      if(BATTING[c]){ bw+=d.w+d.t/2; bn+=n; } else { pw+=d.w+d.t/2; pn+=n; }
    });
    r.bat=bn?bw/bn:null; r.pit=pn?pw/pn:null;
    return r;
  }).filter(function(r){ return r.weeks>0; });
  rows.sort(function(a,b){ return b.pct-a.pct || b.catPct-a.catPct; });
  rows.forEach(function(r,i){ r.rank=i+1; });
  rows.allCats=CATS;
  return rows;
}


/* ------------------------------------------------------------------ charts */
function svgOpen(w,h,label){
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label)+'" font-family="inherit">';
}
function txt(x,y,s,o){
  o=o||{};
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'start')+'" font-size="'+(o.size||11)+
    '" fill="'+(o.fill||'var(--muted)')+'" font-weight="'+(o.w||'normal')+'">'+esc(s)+'</text>';
}

function lineChart(series, through, hi, lo, label, medianOf){
  var W=1080,H=320,L=52,R=140,T=16,B=38,IW=W-L-R,IH=H-T-B;
  if(hi===lo){ hi=lo+1; }
  var x=function(w){ return L+IW*(through<2?0.5:(w-1)/(through-1)); };
  var y=function(v){ return T+IH*(1-(v-lo)/(hi-lo)); };
  var out=[svgOpen(W,H,label)];
  for(var k=0;k<=4;k++){
    var gy=T+IH*k/4;
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+'" stroke="var(--grid)"/>');
    out.push(txt(L-8,gy+4,(hi-(hi-lo)*k/4).toFixed(Math.abs(hi-lo)<5?2:0),{a:'end'}));
  }
  for(var w=1;w<=through;w++){
    if(through<=20||w%2===1){ out.push(txt(x(w),T+IH+16,w,{a:'middle'})); }
  }
  series.forEach(function(s){
    var pts=[];
    for(var w=1;w<=through;w++){ if(s.v[w]!=null){ pts.push(x(w).toFixed(1)+','+y(s.v[w]).toFixed(1)); } }
    if(pts.length){
      out.push('<polyline fill="none" stroke="var(--muted)" stroke-width="1.1" opacity=".3" points="'+
               pts.join(' ')+'"><title>'+esc(s.name)+'</title></polyline>');
    }
  });
  if(medianOf){
    var med=[];
    for(w=1;w<=through;w++){
      var v=series.map(function(s){return s.v[w];}).filter(function(z){return z!=null;}).sort(function(a,b){return a-b;});
      if(v.length){ med.push([w,v[Math.floor(v.length/2)]]); }
    }
    if(med.length){
      out.push('<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="'+
               med.map(function(p){return x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1);}).join(' ')+'"/>');
      out.push(txt(L+IW+8, y(med[med.length-1][1])+4, 'league median', {fill:'var(--accent)', w:'600'}));
    }
  }
  out.push(txt(L+IW/2,H-6,'Week',{a:'middle',size:12}));
  out.push('</svg>');
  return out.join('');
}

function scatter(rows, xf, yf, xlab, ylab, label){
  var W=760,H=430,L=62,R=24,T=18,B=48,IW=W-L-R,IH=H-T-B;
  var xs=rows.map(xf).filter(function(v){return v!=null;});
  var ys=rows.map(yf).filter(function(v){return v!=null;});
  if(!xs.length||!ys.length){ return ''; }
  var xlo=Math.min.apply(null,xs),xhi=Math.max.apply(null,xs);
  var ylo=Math.min.apply(null,ys),yhi=Math.max.apply(null,ys);
  var xp=(xhi-xlo)*0.12||0.01, yp=(yhi-ylo)*0.12||0.01;
  xlo-=xp; xhi+=xp; ylo-=yp; yhi+=yp;
  var x=function(v){ return L+IW*(v-xlo)/(xhi-xlo); };
  var y=function(v){ return T+IH*(1-(v-ylo)/(yhi-ylo)); };
  var out=[svgOpen(W,H,label)];
  for(var k=0;k<=4;k++){
    var gx=L+IW*k/4, gy=T+IH*k/4;
    out.push('<line x1="'+gx.toFixed(1)+'" y1="'+T+'" x2="'+gx.toFixed(1)+'" y2="'+(T+IH)+'" stroke="var(--grid)"/>');
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+'" stroke="var(--grid)"/>');
    out.push(txt(gx,T+IH+16,((xlo+(xhi-xlo)*k/4)*100).toFixed(0),{a:'middle'}));
    out.push(txt(L-8,gy+4,((yhi-(yhi-ylo)*k/4)*100).toFixed(0),{a:'end'}));
  }
  // Parity line: equally good at both halves of the game.
  var d0=Math.max(xlo,ylo), d1=Math.min(xhi,yhi);
  out.push('<line x1="'+x(d0).toFixed(1)+'" y1="'+y(d0).toFixed(1)+'" x2="'+x(d1).toFixed(1)+
           '" y2="'+y(d1).toFixed(1)+'" stroke="var(--muted)" stroke-dasharray="5 4" opacity=".65"/>');
  rows.forEach(function(r){
    var xv=xf(r), yv=yf(r);
    if(xv==null||yv==null){ return; }
    out.push('<circle cx="'+x(xv).toFixed(1)+'" cy="'+y(yv).toFixed(1)+'" r="5" fill="'+
             (yv>=xv?'var(--pit)':'var(--bat)')+'" fill-opacity=".8"><title>'+esc(r.team)+'</title></circle>');
    out.push(txt(x(xv)+8,y(yv)+4, r.team.length>20? r.team.slice(0,19)+'…':r.team,
                 {size:10.5,fill:'var(--ink)'}));
  });
  out.push(txt(L+IW/2,H-8,xlab,{a:'middle',size:12}));
  out.push('<text transform="translate(14,'+(T+IH/2)+') rotate(-90)" text-anchor="middle" '+
           'font-size="12" fill="var(--muted)">'+esc(ylab)+'</text>');
  out.push('</svg>');
  return out.join('');
}

/* ---------------------------------------------------------------- sections */
var SECTIONS=[];
function sect(id,title,note,body){
  SECTIONS.push([id,title]);
  return '<section id="'+id+'"><h2>'+esc(title)+'</h2><p class="note">'+note+'</p>'+body+'</section>';
}
function table(cls, head, body){
  return '<div class="scroll"><table class="'+cls+'"><thead>'+head+'</thead><tbody>'+body+
         '</tbody></table></div>';
}

function overview(rows, season){
  var combined=Array.isArray(season);
  var CATS=combined? rows.allCats : season.cats_high.concat(season.cats_low);
  var top=rows[0];
  var bestCat=rows.slice().sort(function(a,b){return b.catPct-a.catPct;})[0];
  var lucky=rows.slice().sort(function(a,b){return b.luck-a.luck;})[0];
  var unlucky=rows.slice().sort(function(a,b){return a.luck-b.luck;})[0];
  var bat=rows.slice().sort(function(a,b){return (b.bat||0)-(a.bat||0);})[0];
  var pit=rows.slice().sort(function(a,b){return (b.pit||0)-(a.pit||0);})[0];
  var peak=rows.slice().sort(function(a,b){return b.bestCats-a.bestCats;})[0];
  var cards=[
    ['Top of the table', top.team, top.w+'-'+top.l+'-'+top.t_+
      (combined? ' over '+top.nSeasons+' season'+(top.nSeasons===1?'':'s')
               : ' through week '+season.complete_through)],
    ['Best category rate', bestCat.team, pct(bestCat.catPct)+'% of categories won'],
    ['Best bats', bat.team, pct(bat.bat)+'% of batting categories'],
    ['Best arms', pit.team, pct(pit.pit)+'% of pitching categories'],
    ['Best served by the schedule', lucky.team, (lucky.luck>=0?'+':'')+pct(lucky.luck)+' over all-play'],
    ['Worst served', unlucky.team, pct(unlucky.luck)+' under all-play'],
    ['Biggest week', peak.team, peak.bestCats+' categories won in a single week']
  ];
  return sect('overview','Overview','What this covers and how to read it.',
    '<p class="lead">'+esc(BB.league)+', '+esc(seasonLabel(season))+', '+
    (combined? rows.length+' teams across '+season.length+' seasons'
             : season.teams.length+' teams, complete through week '+season.complete_through)+
    '. Scoring is head-to-head by category: each week is a set of separate contests and '+
    'whoever takes more of them wins the week. That makes the fixture list matter, so '+
    'everything below is read against an all-play record &mdash; what each team would have '+
    'done against every opponent, every week.'+
    (combined? ' The category set changed between 2025 and 2026, so raw production is left '+
               'to the single-season views and this one keeps to rates.' : '')+'</p>'+
    '<div class="cards">'+cards.map(function(c){
      return '<div class="card"><div class="label">'+esc(c[0])+'</div><div class="val">'+
             esc(c[1])+'</div><div class="why">'+esc(c[2])+'</div></div>';
    }).join('')+'</div>');
}

function standings(rows, combined){
  if(combined){
    var cb=rows.map(function(r){
      return '<tr><td class="name">'+esc(r.team)+'</td><td>'+r.rank+'</td>'+
        '<td data-sort="'+r.nSeasons+'">'+r.nSeasons+'</td>'+
        '<td data-sort="'+r.games+'">'+r.games+'</td>'+
        '<td data-sort="'+r.pct+'">'+r.w+'-'+r.l+'-'+r.t_+'</td>'+
        '<td data-sort="'+r.pct+'">'+pct(r.pct)+'</td>'+
        '<td data-sort="'+r.cw+'">'+r.cw+'-'+r.cl+'-'+r.ct+'</td>'+
        '<td data-sort="'+r.catPct+'">'+pct(r.catPct)+'</td>'+
        '<td data-sort="'+r.apPct+'">'+pct(r.apPct)+'</td></tr>';
    }).join('');
    return sect('standings','Standings, all seasons',
      'Every season added together. Category records combine cleanly even though the '+
      'category set changed, since what is counted is contests won rather than the '+
      'statistics themselves.',
      table('sortable','<tr><th>Team</th><th>#</th><th>Seasons</th><th>Weeks</th>'+
        '<th>W-L-T</th><th>Win%</th><th>Cats W-L-T</th><th>Cat%</th><th>All-play%</th>'+
        '</tr>', cb));
  }
  var body=rows.map(function(r){
    return '<tr><td class="name">'+esc(r.team)+'</td><td>'+r.rank+'</td>'+
      '<td data-sort="'+r.pct+'">'+r.w+'-'+r.l+'-'+r.t_+'</td>'+
      '<td data-sort="'+r.pct+'">'+pct(r.pct)+'</td>'+
      '<td data-sort="'+r.cw+'">'+r.cw+'-'+r.cl+'-'+r.ct+'</td>'+
      '<td data-sort="'+r.catPct+'">'+pct(r.catPct)+'</td>'+
      '<td data-sort="'+r.apPct+'">'+pct(r.apPct)+'</td>'+
      '<td data-sort="'+(r.bat||0)+'">'+pct(r.bat)+'</td>'+
      '<td data-sort="'+(r.pit||0)+'">'+pct(r.pit)+'</td></tr>';
  }).join('');
  return sect('standings','Standings',
    'Weeks won, then the category record underneath, then how each half of the roster '+
    'is doing. Batting and pitching rates are measured all-play.',
    table('sortable','<tr><th>Team</th><th>#</th><th>W-L-T</th><th>Win%</th>'+
      '<th>Cats W-L-T</th><th>Cat%</th><th>All-play%</th><th>Bat%</th><th>Pitch%</th></tr>', body));
}

function luck(rows){
  var sorted=rows.slice().sort(function(a,b){return b.luck-a.luck;});
  var span=Math.max.apply(null,sorted.map(function(r){return Math.abs(r.luck);}))||0.01;
  var body=sorted.map(function(r){
    var wdt=46*Math.abs(r.luck)/span, left=r.luck<0?50-wdt:50;
    var col=r.luck>=0?'var(--accent)':'var(--warm)';
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+r.luck+'"><span class="diverge"><i style="left:'+left.toFixed(1)+
      '%;width:'+Math.max(wdt,1).toFixed(1)+'%;background:'+col+'"></i><span class="mid"></span></span></td>'+
      '<td data-sort="'+r.luck+'">'+(r.luck>=0?'+':'')+pct(r.luck)+'</td>'+
      '<td data-sort="'+r.pct+'">'+pct(r.pct)+'</td>'+
      '<td data-sort="'+r.apPct+'">'+pct(r.apPct)+'</td></tr>';
  }).join('');
  return sect('luck','Record against the schedule',
    'A week is won by taking more categories than one particular opponent, and who that '+
    'was each week is nobody&rsquo;s doing. Green means the record runs ahead of what the '+
    'same category lines would have earned against the whole field; warm means the draw '+
    'has cost something.',
    table('sortable','<tr><th>Team</th><th>Schedule effect</th><th>Gap</th>'+
      '<th>Actual win%</th><th>All-play win%</th></tr>', body));
}

function categories(rows, season){
  var combined=Array.isArray(season);
  var CATS=combined? rows.allCats : season.cats_high.concat(season.cats_low);
  var lows=combined
    ? season.reduce(function(a,s){ return a.concat(s.cats_low); },[])
    : season.cats_low;
  function shade(v){
    var t=Math.max(0,Math.min(1,v));
    return 'hsl(150 38% '+(92-40*t).toFixed(0)+'%)';
  }
  var head='<tr><th>Team</th>'+CATS.map(function(c){
    return '<th title="'+(lows.indexOf(c)>=0?'lower is better':'higher is better')+
           '">'+esc(c)+'</th>';
  }).join('')+'</tr>';
  var body=rows.map(function(r){
    var cells=CATS.map(function(c){
      var d=r.cats[c], n=d.w+d.l+d.t;
      if(!n){ return '<td class="c dim">--</td>'; }
      var v=(d.w+d.t/2)/n;
      return '<td class="c" style="background:'+shade(v)+'" title="'+esc(c)+': '+d.w+'-'+d.l+'-'+d.t+
             '">'+(v*100).toFixed(0)+'</td>';
    }).join('');
    return '<tr><td class="name">'+esc(r.team)+'</td>'+cells+'</tr>';
  }).join('');
  return sect('categories','Category profile',
    'Share of category contests won, measured against every opponent every week rather '+
    'than only the scheduled one. Darker is stronger. '+
    esc(lows.filter(function(c,i,a){ return a.indexOf(c)===i; }).join(' and '))+
    ' are won by the lower number; the rest by the higher.'+
    (combined? ' The scoring categories changed between 2025 and 2026, so a column is '+
               'blank for teams who never played it.' : ''),
    table('heat', head, body));
}

function crowns(rows, season){
  var CATS=season.cats_high.concat(season.cats_low);
  var body=CATS.map(function(c){
    var ranked=rows.map(function(r){
      var vals=r.totals[c]||[];
      // Rate stats are averaged over the weeks; counting stats are summed.
      var rate=(c==='AVG'||c==='OBP'||c==='ERA'||c==='WHIP');
      var v=vals.length? (rate? mean(vals) : vals.reduce(function(x,y){return x+y;},0)) : null;
      return {team:r.team, v:v, rate:rate};
    }).filter(function(z){ return z.v!=null; });
    if(!ranked.length){ return ''; }
    var lowBetter=season.cats_low.indexOf(c)>=0;
    ranked.sort(function(a,b){ return lowBetter? a.v-b.v : b.v-a.v; });
    var dp=ranked[0].rate?3:0;
    return '<tr><td class="name">'+esc(c)+'</td>'+
      '<td class="crown">'+esc(ranked[0].team)+'</td><td>'+fmt(ranked[0].v,dp)+'</td>'+
      '<td class="dim">'+esc(ranked[1]?ranked[1].team:'--')+'</td>'+
      '<td class="dim">'+(ranked[1]?fmt(ranked[1].v,dp):'--')+'</td>'+
      '<td class="dim">'+esc(ranked[ranked.length-1].team)+'</td>'+
      '<td class="dim">'+fmt(ranked[ranked.length-1].v,dp)+'</td></tr>';
  }).join('');
  return sect('crowns','Category crowns',
    'Season totals per category &mdash; summed for counting stats, averaged over the weeks '+
    'for rate stats. This is raw production, not contests won, so it can disagree with the '+
    'profile above: a team can lead a category outright and still lose it most weeks.',
    table('sortable','<tr><th>Category</th><th>Leader</th><th>Total</th><th>Runner-up</th>'+
      '<th>Total</th><th>Last</th><th>Total</th></tr>', body));
}

function batpitch(rows){
  var chart=scatter(rows, function(r){return r.bat;}, function(r){return r.pit;},
    'Batting categories won, %', 'Pitching categories won, %', 'Batting against pitching');
  var body=rows.slice().sort(function(a,b){
    return ((b.bat||0)+(b.pit||0))-((a.bat||0)+(a.pit||0));
  }).map(function(r){
    var gap=(r.bat==null||r.pit==null)?null:r.bat-r.pit;
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+(r.bat||0)+'">'+pct(r.bat)+'</td>'+
      '<td data-sort="'+(r.pit||0)+'">'+pct(r.pit)+'</td>'+
      '<td data-sort="'+(gap||0)+'" class="'+(gap>=0?'up':'down')+'">'+
        (gap==null?'--':(gap>=0?'+':'')+pct(gap))+'</td>'+
      '<td class="dim">'+(gap==null?'--':(gap>=0?'bats':'arms'))+'</td></tr>';
  }).join('');
  return sect('batpitch','Batting against pitching',
    'Each half of the roster as its own all-play win rate. The dashed line is parity; '+
    'above it a team is carried by its arms, below it by its bats. A team can be good '+
    'overall and lopsided, which is what shows up here and nowhere else.',
    chart + table('sortable','<tr><th>Team</th><th>Bat%</th><th>Pitch%</th><th>Gap</th>'+
      '<th>Leans on</th></tr>', body));
}

function weekly(rows, season){
  var CATS=season.cats_high.concat(season.cats_low);
  var pick=window.__cat||'__wins';
  var opts='<option value="__wins"'+(pick==='__wins'?' selected':'')+'>categories won</option>'+
    CATS.map(function(c){
      return '<option value="'+esc(c)+'"'+(pick===c?' selected':'')+'>'+esc(c)+'</option>';
    }).join('');
  var series, hi, lo, note;
  if(pick==='__wins'){
    series=rows.map(function(r){ return {name:r.team, v:r.byWeek}; });
    hi=CATS.length; lo=0;
    note='Out of '+CATS.length+' each week.';
  } else {
    series=rows.map(function(r){
      var v={};
      Object.keys(r.catByWeek).forEach(function(w){
        if(r.catByWeek[w][pick]!=null){ v[w]=r.catByWeek[w][pick]; }
      });
      return {name:r.team, v:v};
    });
    var all=[];
    series.forEach(function(s){ Object.keys(s.v).forEach(function(w){ all.push(s.v[w]); }); });
    if(!all.length){ return ''; }
    hi=Math.max.apply(null,all); lo=Math.min.apply(null,all);
    var pad=(hi-lo)*0.08; hi+=pad; lo-=pad;
    note=esc(pick)+' produced each week'+(season.cats_low.indexOf(pick)>=0?', lower is better':'');
  }
  return sect('weekly','Week by week',
    note+' Every team faintly, with the league median through the middle. '+
    'Pick a category to follow it on its own.',
    '<div class="tools" style="margin-bottom:12px"><label>show '+
    '<select id="catpick">'+opts+'</select></label></div>'+
    lineChart(series, season.complete_through, hi, lo, 'Week by week', true));
}

function power(rows, season){
  /* All-play win rate as it stood after each week, which is the closest thing
     to a power rating the data supports: it ignores the fixture list entirely
     and updates every week. */
  var through=season.complete_through||0;
  var CATS=season.cats_high.concat(season.cats_low);
  var running={}, series=[];
  rows.forEach(function(r){ running[r.team]={w:0,n:0,v:{}}; });
  for(var wk=1; wk<=through; wk++){
    var live=rows.filter(function(r){ return r.catByWeek[wk]; });
    live.forEach(function(r){
      var me=running[r.team];
      live.forEach(function(o){
        if(o.team===r.team){ return; }
        var aw=0,al=0;
        CATS.forEach(function(c){
          var x=cmpCat(season,c,r.catByWeek[wk][c],o.catByWeek[wk][c]);
          if(x===null){ return; }
          if(x>0){ aw++; } else if(x<0){ al++; }
        });
        me.n++; if(aw>al){ me.w++; } else if(aw===al){ me.w+=0.5; }
      });
      me.v[wk]= me.n? me.w/me.n : null;
    });
  }
  rows.forEach(function(r){ series.push({name:r.team, v:running[r.team].v}); });
  var all=[];
  series.forEach(function(s){ Object.keys(s.v).forEach(function(w){ if(s.v[w]!=null){ all.push(s.v[w]); } }); });
  if(!all.length){ return ''; }
  return sect('power','Power rating over time',
    'Cumulative all-play win rate after each week. Because it scores every team against '+
    'the whole field it moves on performance alone, so a team climbing here while sliding '+
    'in the table is losing to the schedule rather than to the league.',
    lineChart(series, through, Math.max.apply(null,all)+0.03,
              Math.min.apply(null,all)-0.03, 'Power rating over time', true));
}

function h2h(rows, season){
  var order=rows.map(function(r){return r.team;});
  var head='<tr><th>Team</th>'+order.map(function(t){
    return '<th title="'+esc(t)+'">'+esc(t.slice(0,3))+'</th>';
  }).join('')+'<th>Rec</th></tr>';
  var body=rows.map(function(r){
    var cells=order.map(function(o){
      if(o===r.team){ return '<td class="cell self">&mdash;</td>'; }
      var won=r.h2h[o]||0;
      var other=rows.filter(function(x){return x.team===o;})[0];
      var lost=(other&&other.h2h[r.team])||0;
      if(!won&&!lost){ return '<td class="cell dim">·</td>'; }
      // Shaded by win rate, so a dominant pairing reads without being counted.
      var v=won/(won+lost);
      var hue=v>=0.5?150:18;
      var strength=Math.abs(v-0.5)*2;
      return '<td class="cell" style="background:hsl('+hue+' 45% '+
             (92-30*strength).toFixed(0)+'%);color:#10140f">'+won+'-'+lost+'</td>';
    }).join('');
    return '<tr><td class="name">'+esc(r.team)+'</td>'+cells+'<td>'+r.w+'-'+r.l+'-'+r.t_+'</td></tr>';
  }).join('');
  return sect('h2h','Head to head',
    'Weeks won against each opponent in '+esc(seasonLabel(season))+'. Columns are the first '+
    'three characters of the team name; hover for the full one.'+
    (Array.isArray(season)? ' Teams that never shared a season show a dot.' : ''),
    table('h2h', head, body));
}

function royal(rows, season){
  var combined=Array.isArray(season);
  var through=combined? 0 : (season.complete_through||0);
  var order=rows.slice().sort(function(a,b){ return b.royals-a.royals || b.bestCats-a.bestCats; });
  var royalOf={};
  rows.forEach(function(r){
    Object.keys(r.apByWeek).forEach(function(w){
      var d=r.apByWeek[w];
      if(d.n>0 && d.w===d.n){ royalOf[w]=r.team; }
    });
  });

  var W=1080,H=52+rows.length*22,L=210,R=20,T=34,IW=W-L-R;
  var x=function(w){ return L+IW*(through<2?0.5:(w-0.5)/through); };
  var out=[svgOpen(W,H,'Royal weeks')];
  out.push(txt(L-10,18,'week',{a:'end',size:11}));
  for(var w=1;w<=through;w++){
    if(through<=24||w%2===1){ out.push(txt(x(w),18,w,{a:'middle',size:10})); }
  }
  order.forEach(function(r,i){
    var y=T+i*22;
    out.push(txt(L-10,y+11,r.team.length>28?r.team.slice(0,27)+'…':r.team,
                 {a:'end',size:11.5,fill:'var(--ink)',w:'600'}));
    out.push('<line x1="'+L+'" y1="'+(y+7)+'" x2="'+(L+IW)+'" y2="'+(y+7)+'" stroke="var(--grid)"/>');
    for(var wk=1;wk<=through;wk++){
      if(royalOf[wk]===r.team){
        out.push('<circle cx="'+x(wk).toFixed(1)+'" cy="'+(y+7)+'" r="6" fill="var(--accent)">'+
                 '<title>week '+wk+': royal week</title></circle>');
      }
    }
  });
  out.push('</svg>');

  var body=order.map(function(r){
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+r.royals+'" class="'+(r.royals?'up':'dim')+'">'+r.royals+'</td>'+
      '<td data-sort="'+r.bestCats+'">'+r.bestCats+'</td></tr>';
  }).join('');

  var nr=Object.keys(royalOf).length;
  if(combined){
    var weeksAll=rows.reduce(function(n,r){ return n+Object.keys(r.apByWeek).length; },0);
    return sect('royal','Royal weeks',
      'A royal week is one a team would have beaten every other team in the league, not '+
      'merely the opponent it happened to draw. Counted across every season on file. The '+
      'week-by-week chart is left to the single-season views, since week numbers repeat '+
      'each year and would overlay one season on another.',
      table('sortable','<tr><th>Team</th><th>Royal weeks</th>'+
        '<th>Best week, cats won</th></tr>', body));
  }
  return sect('royal','Royal weeks',
    'A royal week is one a team would have beaten every other team in the league, not '+
    'merely the opponent it happened to draw. That is what makes it worth counting: it '+
    'owes nothing to the schedule. Of '+through+' weeks, '+nr+' produced a royal; in the '+
    'rest nobody was clear of the whole field.',
    out.join('') +
    table('sortable','<tr><th>Team</th><th>Royal weeks</th>'+
      '<th>Best week, cats won</th></tr>', body));
}

function statbars(rows, season){
  var CATS=season.cats_high.concat(season.cats_low);
  var pick=(CATS.indexOf(window.__bar)>=0)? window.__bar : CATS[0];
  var rate=(pick==='AVG'||pick==='OBP'||pick==='ERA'||pick==='WHIP');
  var lowBetter=season.cats_low.indexOf(pick)>=0;
  var vals=rows.map(function(r){
    var v=r.totals[pick]||[];
    return {team:r.team,
            v: v.length? (rate? mean(v) : v.reduce(function(x,y){return x+y;},0)) : null};
  }).filter(function(z){ return z.v!=null; });
  if(!vals.length){ return ''; }
  vals.sort(function(a,b){ return lowBetter? a.v-b.v : b.v-a.v; });

  var lo=Math.min.apply(null,vals.map(function(z){return z.v;}));
  var hi=Math.max.apply(null,vals.map(function(z){return z.v;}));
  // Rate stats sit too close together to read from a zero baseline, so the
  // axis starts just below the field instead.
  var base=rate? lo-(hi-lo)*0.4 : 0;
  var W=1080, rowH=26, L=230, R=95, T=10, H=T+vals.length*rowH+14, IW=W-L-R;
  var out=[svgOpen(W,H,'Team totals for '+pick)];
  vals.forEach(function(z,i){
    var y=T+i*rowH;
    var frac=(hi===base)?1:(z.v-base)/(hi-base);
    var len=Math.max(2, IW*Math.max(frac,0.02));
    out.push(txt(L-10,y+15,z.team.length>30?z.team.slice(0,29)+'…':z.team,
                 {a:'end',size:11.5,fill:'var(--ink)',w:'600'}));
    out.push('<rect x="'+L+'" y="'+(y+4)+'" width="'+len.toFixed(1)+'" height="15" rx="3" fill="'+
             (i===0?'var(--accent)':'var(--muted)')+'" fill-opacity="'+(i===0?'.9':'.55')+'"/>');
    out.push(txt(L+len+8,y+16,fmt(z.v,rate?3:0),{size:11,fill:'var(--ink)'}));
  });
  out.push('</svg>');

  var opts=CATS.map(function(c){
    return '<option value="'+esc(c)+'"'+(c===pick?' selected':'')+'>'+esc(c)+'</option>';
  }).join('');
  return sect('bars','Team totals by category',
    'Season production per team, one category at a time, summed for counting stats and '+
    'averaged over the weeks for rate stats. '+
    (lowBetter? esc(pick)+' is won by the lower number, so the shortest bar leads. ' : '')+
    (rate? 'The axis starts below the field rather than at zero; rate stats sit too close '+
           'together to tell apart otherwise.' : ''),
    '<div class="tools" style="margin-bottom:12px"><label>category '+
    '<select id="barpick">'+opts+'</select></label></div>'+out.join(''));
}

function zscores(rows, season){
  var CATS=season.cats_high.concat(season.cats_low);
  /* Each category standardised across the league and flipped where low is
     better, so every axis points the same way. Batting and pitching are then
     the mean z across their own categories, which is what puts a team scoring
     900 runs and a team with a 3.10 ERA on one comparable scale. */
  var z={};
  rows.forEach(function(r){ z[r.team]={bat:[],pit:[]}; });
  CATS.forEach(function(c){
    var rate=(c==='AVG'||c==='OBP'||c==='ERA'||c==='WHIP');
    var vals=rows.map(function(r){
      var v=r.totals[c]||[];
      return v.length? (rate? mean(v) : v.reduce(function(x,y){return x+y;},0)) : null;
    });
    var got=vals.filter(function(v){ return v!=null; });
    if(got.length<2){ return; }
    var m=mean(got);
    var sd=Math.sqrt(got.reduce(function(s,v){return s+(v-m)*(v-m);},0)/(got.length-1));
    if(!sd){ return; }
    var flip=(season.cats_low.indexOf(c)>=0)? -1 : 1;
    rows.forEach(function(r,i){
      if(vals[i]==null){ return; }
      z[r.team][BATTING[c]?'bat':'pit'].push(flip*(vals[i]-m)/sd);
    });
  });
  rows.forEach(function(r){
    var d=z[r.team];
    r.zbat=d.bat.length? mean(d.bat):null;
    r.zpit=d.pit.length? mean(d.pit):null;
    r.ztot=(r.zbat==null||r.zpit==null)?null:r.zbat+r.zpit;
  });

  var body=rows.slice().sort(function(a,b){ return (b.ztot==null?-9:b.ztot)-(a.ztot==null?-9:a.ztot); })
    .map(function(r){
      var shape='--';
      if(r.zbat!=null && r.zpit!=null){
        shape = Math.abs(r.zbat-r.zpit)<0.25 ? 'balanced' : (r.zbat>r.zpit?'bats':'arms');
      }
      return '<tr><td class="name">'+esc(r.team)+'</td>'+
        '<td data-sort="'+(r.zbat==null?0:r.zbat)+'" class="'+((r.zbat||0)>=0?'up':'down')+'">'+
          fmt(r.zbat,2)+'</td>'+
        '<td data-sort="'+(r.zpit==null?0:r.zpit)+'" class="'+((r.zpit||0)>=0?'up':'down')+'">'+
          fmt(r.zpit,2)+'</td>'+
        '<td data-sort="'+(r.ztot==null?0:r.ztot)+'">'+fmt(r.ztot,2)+'</td>'+
        '<td class="dim">'+shape+'</td></tr>';
    }).join('');
  return sect('zscore','Standardised category scores',
    'Every category expressed as standard deviations from the league mean, with the '+
    'lower-is-better ones flipped so positive is always good. This measures production '+
    'rather than contests won, so it says how far ahead a team is and not merely how '+
    'often: a team can win a category most weeks by a hair and still score near zero.',
    scatterZ(rows) + table('sortable','<tr><th>Team</th><th>Batting z</th>'+
      '<th>Pitching z</th><th>Total</th><th>Shape</th></tr>', body));
}

function scatterZ(rows){
  var pts=rows.filter(function(r){ return r.zbat!=null && r.zpit!=null; });
  if(pts.length<2){ return ''; }
  var W=760,H=440,L=58,R=24,T=18,B=48,IW=W-L-R,IH=H-T-B;
  var m=Math.max(1.2, Math.max.apply(null, pts.map(function(r){
    return Math.max(Math.abs(r.zbat),Math.abs(r.zpit));
  }))*1.15);
  var x=function(v){ return L+IW*(v+m)/(2*m); };
  var y=function(v){ return T+IH*(1-(v+m)/(2*m)); };
  var out=[svgOpen(W,H,'Standardised batting against pitching')];
  for(var k=0;k<=4;k++){
    var gx=L+IW*k/4, gy=T+IH*k/4;
    out.push('<line x1="'+gx.toFixed(1)+'" y1="'+T+'" x2="'+gx.toFixed(1)+'" y2="'+(T+IH)+
             '" stroke="var(--grid)"/>');
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+
             '" stroke="var(--grid)"/>');
    out.push(txt(gx,T+IH+16,(-m+2*m*k/4).toFixed(1),{a:'middle'}));
    out.push(txt(L-8,gy+4,(m-2*m*k/4).toFixed(1),{a:'end'}));
  }
  out.push('<line x1="'+x(0).toFixed(1)+'" y1="'+T+'" x2="'+x(0).toFixed(1)+'" y2="'+(T+IH)+
           '" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".7"/>');
  out.push('<line x1="'+L+'" y1="'+y(0).toFixed(1)+'" x2="'+(L+IW)+'" y2="'+y(0).toFixed(1)+
           '" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".7"/>');
  out.push(txt(L+IW-8,T+14,'good at both',{a:'end',size:10.5}));
  out.push(txt(L+8,T+IH-8,'good at neither',{size:10.5}));
  pts.forEach(function(r){
    out.push('<circle cx="'+x(r.zbat).toFixed(1)+'" cy="'+y(r.zpit).toFixed(1)+'" r="5.5" fill="'+
             (r.zpit>=r.zbat?'var(--pit)':'var(--bat)')+'" fill-opacity=".8"><title>'+esc(r.team)+
             '</title></circle>');
    out.push(txt(x(r.zbat)+8,y(r.zpit)+4, r.team.length>20?r.team.slice(0,19)+'…':r.team,
                 {size:10.5,fill:'var(--ink)'}));
  });
  out.push(txt(L+IW/2,H-8,'Batting, standard deviations from the league mean',
               {a:'middle',size:12}));
  out.push('<text transform="translate(14,'+(T+IH/2)+') rotate(-90)" text-anchor="middle" '+
           'font-size="12" fill="var(--muted)">Pitching, standard deviations</text>');
  out.push('</svg>');
  return out.join('');
}

function trophies(){
  /* Two different competitions. The regular-season placing is recomputed from
     the weekly results, which is the only place it exists; the postseason
     finish comes from the stored league history, which is the only place
     that one does. */
  var reg={}, post={};
  BB.seasons.forEach(function(season){
    analyse(season).forEach(function(r,i){
      var t=reg[r.team]=reg[r.team]||{first:0,second:0,third:0,seasons:0};
      t.seasons++;
      if(i===0){ t.first++; } else if(i===1){ t.second++; } else if(i===2){ t.third++; }
    });
  });
  (BB.history||[]).forEach(function(r){
    if(!r.finish){ return; }
    var t=post[r.team]=post[r.team]||{first:0,second:0,third:0};
    if(r.finish===1){ t.first++; } else if(r.finish===2){ t.second++; }
    else if(r.finish===3){ t.third++; }
  });

  var names={};
  Object.keys(reg).forEach(function(n){ names[n]=1; });
  Object.keys(post).forEach(function(n){ names[n]=1; });
  var list=Object.keys(names).map(function(n){
    var a=reg[n]||{first:0,second:0,third:0,seasons:0};
    var b=post[n]||{first:0,second:0,third:0};
    return {team:n, r:a, p:b,
            score:(b.first*9+b.second*4+b.third*2)+(a.first*3+a.second*2+a.third)};
  }).filter(function(z){ return z.score>0 || z.r.seasons; });
  list.sort(function(x,y){ return y.score-x.score || y.p.first-x.p.first; });

  function medal(n, cls){
    return n? '<span class="pill '+cls+'">'+n+'</span>' : '<span class="dim">&mdash;</span>';
  }
  var body=list.map(function(z){
    return '<tr><td class="name">'+esc(z.team)+'</td>'+
      '<td data-sort="'+z.p.first+'">'+medal(z.p.first,'gold')+'</td>'+
      '<td data-sort="'+z.p.second+'">'+medal(z.p.second,'silver')+'</td>'+
      '<td data-sort="'+z.p.third+'">'+medal(z.p.third,'bronze')+'</td>'+
      '<td data-sort="'+z.r.first+'">'+medal(z.r.first,'gold')+'</td>'+
      '<td data-sort="'+z.r.second+'">'+medal(z.r.second,'silver')+'</td>'+
      '<td data-sort="'+z.r.third+'">'+medal(z.r.third,'bronze')+'</td>'+
      '<td data-sort="'+z.r.seasons+'" class="dim">'+z.r.seasons+'</td></tr>';
  }).join('');

  var empty=list.filter(function(z){ return z.score===0; }).length;
  return sect('trophies','Trophy room',
    'Podium finishes in each of the two competitions the league actually runs. The '+
    'postseason column is the final placing recorded in the league history; the regular '+
    'season is recomputed here from the weekly results, being the only place it exists. '+
    'They disagree often, which is rather the point of a playoff. '+
    (empty? empty+' of the '+list.length+' teams have never placed in either.' : ''),
    table('sortable','<tr><th>Team</th><th>Post 1st</th><th>Post 2nd</th><th>Post 3rd</th>'+
      '<th>Reg 1st</th><th>Reg 2nd</th><th>Reg 3rd</th><th>Seasons</th></tr>', body));
}

function finishes(){
  var h=BB.history||[];
  if(!h.length){ return ''; }
  var seasons=[]; h.forEach(function(r){ if(seasons.indexOf(r.season)<0){ seasons.push(r.season); } });
  seasons.sort();
  var teams={};
  h.forEach(function(r){ (teams[r.team]=teams[r.team]||{})[r.season]=r; });
  var names=Object.keys(teams).sort(function(a,b){
    return Object.keys(teams[b]).length-Object.keys(teams[a]).length || a.localeCompare(b);
  });
  var head='<tr><th>Team</th>'+seasons.map(function(s){return '<th>'+esc(s)+'</th>';}).join('')+'</tr>';
  var body=names.map(function(n){
    var cells=seasons.map(function(s){
      var r=teams[n][s];
      if(!r){ return '<td class="dim">--</td>'; }
      var badge=r.champion?' <span class="pill gold">champ</span>':
                (r.reg_champ?' <span class="pill">reg</span>':'');
      var label=r.finish? r.finish+' of '+r.of : '--';
      if(r.status && r.status!=='complete'){ label+=' *'; }
      return '<td data-sort="'+(r.finish||99)+'">'+label+badge+'</td>';
    }).join('');
    return '<tr><td class="name">'+esc(n)+'</td>'+cells+'</tr>';
  }).join('');
  return sect('finishes','Finishes by season',
    'Where each team ended up. A star marks a season still in progress; &ldquo;reg&rdquo; '+
    'is the regular-season title and &ldquo;champ&rdquo; the playoff one.',
    table('sortable', head, body));
}

function alltime(){
  /* Career totals are recomputed from the weekly data rather than read from
     the stored league history, which was written partway through the current
     season and is now several weeks stale. Titles and finishes still come
     from there, since nothing in the matchups records them. */
  var agg={};
  BB.seasons.forEach(function(season){
    analyse(season).forEach(function(r){
      var a=agg[r.team]=agg[r.team]||{team:r.team,seasons:0,w:0,l:0,t:0,cw:0,cl:0,ct:0};
      a.seasons++; a.w+=r.w; a.l+=r.l; a.t+=r.t_;
      a.cw+=r.cw; a.cl+=r.cl; a.ct+=r.ct;
    });
  });
  (BB.history||[]).forEach(function(r){
    var a=agg[r.team];
    if(!a){ return; }
    a.titles=(a.titles||0)+(r.champion?1:0);
    a.reg=(a.reg||0)+(r.reg_champ?1:0);
    a.finishes=(a.finishes||[]).concat(r.finish?[r.finish]:[]);
  });
  var rows=Object.keys(agg).map(function(k){
    var a=agg[k];
    var cg=a.cw+a.cl+a.ct;
    a.catPct=cg?(a.cw+a.ct/2)/cg:0;
    var g=a.w+a.l+a.t;
    a.winPct=g?(a.w+a.t/2)/g:0;
    a.avgFinish=(a.finishes&&a.finishes.length)? mean(a.finishes):null;
    a.best=(a.finishes&&a.finishes.length)? Math.min.apply(null,a.finishes):null;
    return a;
  }).sort(function(x,y){ return y.catPct-x.catPct; });
  var body=rows.map(function(r){
    return '<tr><td class="name">'+esc(r.team)+'</td><td>'+r.seasons+'</td>'+
      '<td data-sort="'+r.winPct+'">'+r.w+'-'+r.l+'-'+r.t+'</td>'+
      '<td data-sort="'+r.winPct+'">'+pct(r.winPct)+'</td>'+
      '<td data-sort="'+r.cw+'">'+r.cw+'-'+r.cl+'-'+r.ct+'</td>'+
      '<td data-sort="'+r.catPct+'">'+pct(r.catPct)+'</td>'+
      '<td data-sort="'+(r.avgFinish||99)+'">'+fmt(r.avgFinish,2)+'</td>'+
      '<td data-sort="'+(r.best||99)+'">'+(r.best||'--')+'</td>'+
      '<td data-sort="'+(r.reg||0)+'">'+(r.reg||0)+'</td>'+
      '<td data-sort="'+(r.titles||0)+'">'+
        (r.titles? '<span class="pill gold">'+r.titles+'</span>':'0')+'</td></tr>';
  }).join('');
  return sect('alltime','All-time',
    'Every season on file, including the one in progress, recomputed from the weekly '+
    'results. Titles and finishes come from the stored league history, which is the only '+
    'place they are recorded.',
    table('sortable','<tr><th>Team</th><th>Seasons</th><th>W-L-T</th><th>Win%</th>'+
      '<th>Cats W-L-T</th><th>Cat%</th><th>Avg finish</th><th>Best</th><th>Reg</th>'+
      '<th>Titles</th></tr>', body));
}

function method(season){
  var combined=Array.isArray(season);
  var ref=combined? season[season.length-1] : season;
  var CATS=ref.cats_high.concat(ref.cats_low);
  return sect('method','Method and glossary','Where the numbers come from.',
    '<p class="note">Built from the league&rsquo;s Yahoo exports: '+
    BB.seasons.map(function(s){
      return esc(s.label)+' ('+s.teams.length+' teams, '+s.weeks.length+' weeks, '+
             (s.cats_high.length+s.cats_low.length)+' categories)';
    }).join(', ')+'. Playoff and consolation weeks are excluded throughout.</p>'+
    table('', '', [
      ['Categories', esc(ref.label)+' scored '+CATS.length+': '+esc(CATS.join(', '))+
        '. The set changed between 2025 and 2026, so each season uses its own. Every set '+
        'and direction was checked by reproducing that season&rsquo;s recorded category '+
        'record exactly rather than assumed.'],
      ['Cat%','Category contests won plus half the ties, against the scheduled opponent.'],
      ['All-play win%','The record a team would hold facing every other team every week '+
        'rather than the one the schedule gave it.'],
      ['Schedule effect','Actual win% minus all-play win%.'],
      ['Bat% / Pitch%','All-play category rate split into the batting and pitching halves '+
        'of the roster.'],
      ['Power rating','Cumulative all-play win rate as it stood after each week.'],
      ['Team names','Managers are aliased to the most recent team name they can be matched '+
        'to, joined on team id so that a mid-season rename or a private profile does not '+
        'split one person into two. Manager names and emails stay in the private data.']
    ].map(function(g){
      return '<tr><td class="name" style="width:160px">'+g[0]+'</td><td style="text-align:left">'+
             g[1]+'</td></tr>';
    }).join('')));
}

function wireSort(){
  document.querySelectorAll('table.sortable').forEach(function(t){
    t.querySelectorAll('th').forEach(function(head,col){
      head.addEventListener('click',function(){
        var body=t.tBodies[0], rs=Array.prototype.slice.call(body.rows);
        var dir=head.dataset.dir==='asc'?-1:1;
        t.querySelectorAll('th').forEach(function(o){ delete o.dataset.dir; });
        head.dataset.dir=dir===1?'asc':'desc';
        rs.sort(function(l,r){
          var a=l.cells[col]?(l.cells[col].dataset.sort!==undefined?l.cells[col].dataset.sort:l.cells[col].textContent):'';
          var b=r.cells[col]?(r.cells[col].dataset.sort!==undefined?r.cells[col].dataset.sort:r.cells[col].textContent):'';
          var x=parseFloat(a),y=parseFloat(b);
          if(!isNaN(x)&&!isNaN(y)){ return (x-y)*dir; }
          return String(a).localeCompare(String(b))*dir;
        });
        rs.forEach(function(row){ body.appendChild(row); });
      });
    });
  });
}

function render(label){
  var season=seasonByLabel(label);
  var combined=Array.isArray(season);
  var rows=analyse(season);
  SECTIONS=[];
  /* Combined view keeps what survives being added up across seasons: records,
     rates and category win shares. Raw production does not, because the
     category set changed and a team with three seasons would simply have
     three times the totals of one with a single season. Week-indexed charts
     do not either, week numbers repeating every year. */
  var html = rows.length
    ? overview(rows,season)+standings(rows,combined)+luck(rows)+categories(rows,season)+
      (combined? '' : crowns(rows,season)+statbars(rows,season)+zscores(rows,season))+
      batpitch(rows)+
      (combined? '' : weekly(rows,season)+power(rows,season))+
      h2h(rows,season)+royal(rows,season)
    : '';
  html += trophies()+finishes()+alltime()+method(season);
  document.getElementById('main').innerHTML=html;
  document.getElementById('toc').innerHTML=SECTIONS.map(function(s){
    return '<a href="#'+s[0]+'">'+esc(s[1])+'</a>';
  }).join('');
  document.getElementById('subtitle').textContent = combined
    ? season.length+' seasons, '+seasonLabel(season)+' · '+rows.length+' teams'
    : season.label+' · '+season.teams.length+' teams · complete through week '+
      season.complete_through+' · '+(season.cats_high.length+season.cats_low.length)+
      ' categories';
  var cp=document.getElementById('catpick');
  if(cp){
    cp.addEventListener('change',function(){ window.__cat=cp.value; render(label); });
  }
  var bp=document.getElementById('barpick');
  if(bp){
    bp.addEventListener('change',function(){ window.__bar=bp.value; render(label); });
  }
  wireSort();
}

(function boot(){
  var sel=document.getElementById('season');
  var labels=BB.seasons.map(function(s){ return s.label; }).sort().reverse();
  sel.innerHTML='<option value="'+ALL+'">all seasons</option>'+
    labels.map(function(l){ return '<option value="'+esc(l)+'">'+esc(l)+'</option>'; }).join('');
  sel.addEventListener('change',function(){
    window.__cat='__wins'; window.__bar=null; render(sel.value);
  });

  var themer=document.getElementById('theme');
  var modes=['auto','light','dark'], at=0;
  try{ at=Math.max(0,modes.indexOf(localStorage.getItem('bbTheme'))); }catch(e){ at=0; }
  function paint(){
    var m=modes[at];
    if(m==='auto'){ document.documentElement.removeAttribute('data-theme'); }
    else { document.documentElement.setAttribute('data-theme',m); }
    themer.textContent='theme: '+m;
    try{ localStorage.setItem('bbTheme',m); }catch(e){}
  }
  paint();
  themer.addEventListener('click',function(){ at=(at+1)%modes.length; paint(); });

  render(labels[0]);
})();
</script>

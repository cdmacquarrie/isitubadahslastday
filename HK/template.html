<style>
:root{
  color-scheme: light dark;
  --bg:#f5f6f8; --panel:#fff; --ink:#15181d; --muted:#5e6673; --line:#e3e6eb;
  --accent:#2f6f4f; --accent-soft:#e7f0ea; --warm:#a4543a; --grid:#eceff3;
}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#191c21; --ink:#e8eaed; --muted:#98a0ac;
  --line:#2a2f37; --accent:#6fbf8f; --accent-soft:#1d2a23; --warm:#d98f6f;
  --grid:#222730;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --panel:#191c21; --ink:#e8eaed; --muted:#98a0ac;
    --line:#2a2f37; --accent:#6fbf8f; --accent-soft:#1d2a23; --warm:#d98f6f;
    --grid:#222730;
  }
}
*{box-sizing:border-box}
body{margin:0;padding:0 0 72px;background:var(--bg);color:var(--ink);
 font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header.top{margin:26px 0 20px;display:flex;flex-wrap:wrap;align-items:flex-end;
 gap:14px;justify-content:space-between}
h1{font-size:30px;margin:0 0 5px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select,.tools button{font:inherit;font-size:13px;padding:6px 10px;
 border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.tools button,.tools select{cursor:pointer}
.tools button:hover,.tools select:hover{border-color:var(--accent)}
nav.toc{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}

 border:1px solid var(--line);border-radius:999px;padding:3px 10px}
nav.toc a:hover{color:var(--accent);border-color:var(--accent)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 padding:18px 20px;margin-bottom:18px}
h2.part{font-size:13px;text-transform:uppercase;letter-spacing:.08em;
 color:var(--muted);margin:26px 0 10px;padding-bottom:6px;
 border-bottom:1px solid var(--line);font-weight:700}
h2.part:first-child{margin-top:4px}
h3{font-size:18px;margin:0 0 4px}
nav.toc{display:block}
.tocgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 7px}
.toclabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
 color:var(--muted);font-weight:700;min-width:96px}
.note{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:78ch}
.lead{font-size:14.5px;line-height:1.6;margin:0 0 16px;max-width:74ch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
 letter-spacing:.04em;cursor:pointer}
th:hover{color:var(--accent)}
td.name{font-weight:600}
tr.hidden{display:none}
.scroll{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:9px;padding:13px 14px;background:var(--bg)}
.card .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
 color:var(--accent);font-weight:700;margin-bottom:5px}

 overflow-wrap:anywhere}
.card .why{font-size:12px;color:var(--muted);margin-top:4px}
.bar{position:relative;display:inline-block;height:15px;width:100%;min-width:90px;
 background:var(--grid);border-radius:3px;overflow:hidden;vertical-align:middle}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85}
.bar>span{position:absolute;right:4px;top:-1px;font-size:10.5px}
.diverge{position:relative;display:inline-block;height:15px;width:100%;min-width:120px;
 background:var(--grid);border-radius:3px;overflow:hidden;vertical-align:middle}
.diverge>i{position:absolute;top:0;bottom:0;border-radius:2px;opacity:.85}
.diverge>.mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.45}
svg{display:block;max-width:100%;height:auto}
.h2h td.cell{text-align:center;font-size:11.5px;padding:4px 5px}
.h2h td.self{background:var(--grid)}
.dim{color:var(--muted)}
.up{color:var(--accent);font-weight:600}
.down{color:var(--warm);font-weight:600}
footer{color:var(--muted);font-size:12px;margin-top:10px}
footer a{color:inherit}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Bettman Cometh</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="tools">

        <select id="season"></select>
      </label>
      <button id="theme" type="button">theme: auto</button>
    </div>

  <nav class="toc" id="toc"></nav>

  <footer>
    Teams are shown by team name; the managers behind them are not named, and the
    exports&rsquo; manager and email columns never leave the private data.
    &middot; istodayubadahslastday.art
  </footer>
</div>

<script>
var HOCKEY = __HOCKEY_JSON__;

/* ------------------------------------------------------------------ utils */
var ENT = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ENT[c];}); }
function fmt(v,dp){ return (v==null||!isFinite(v))?'--':v.toFixed(dp==null?1:dp); }
function mean(a){ return a.length? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }
function sd(a){
  if(a.length<2){ return 0; }
  var m=mean(a);
  return Math.sqrt(a.reduce(function(s,v){return s+(v-m)*(v-m);},0)/(a.length-1));
}

/* Everything on this page derives from one list of matchups, so the whole
   model is rebuilt from that rather than carried in the data file. */
function analyse(input){
  /* Takes one season or a list of them. Aggregating across seasons has to
     keep all-play inside its own season-week: comparing a 2010-11 week
     against a 2025-26 one would be meaningless, and week numbers repeat
     every year, so the weekly points map is kept local to each season and
     only exposed when a single season is on show. */
  var list = Array.isArray(input) ? input : [input];
  var single = list.length === 1;
  var teams = {};
  function slot(t){
    if(!teams[t]){
      teams[t]={team:t, w:0, l:0, t_:0, pf:0, pa:0, weeks:[], byWeek:{}, h2h:{},
                apW:0, apL:0, apT:0, seasons:{}};
    }
    return teams[t];
  }

  list.forEach(function(season){
    season.teams.forEach(slot);
    var pts = {};                       // team -> week -> points, this season
    season.matchups.forEach(function(m){
      var A=slot(m.a), B=slot(m.b);
      A.seasons[season.label]=1; B.seasons[season.label]=1;
      A.pf+=m.ap; A.pa+=m.bp; B.pf+=m.bp; B.pa+=m.ap;
      A.weeks.push(m.ap); B.weeks.push(m.bp);
      (pts[m.a]=pts[m.a]||{})[m.w]=m.ap;
      (pts[m.b]=pts[m.b]||{})[m.w]=m.bp;
      if(single){ A.byWeek[m.w]=m.ap; B.byWeek[m.w]=m.bp; }
      if(m.ap>m.bp){ A.w++; B.l++; A.h2h[m.b]=(A.h2h[m.b]||0)+1; }
      else if(m.bp>m.ap){ B.w++; A.l++; B.h2h[m.a]=(B.h2h[m.a]||0)+1; }
      else { A.t_++; B.t_++; }
    });

    /* All-play: each week, score every team against every other team that
       week rather than only the one the schedule paired them with. It is the
       standard way to strip the fixture list out of a head-to-head record --
       you can score the second-most points in a week and still lose. */
    for(var wk=1; wk<=season.weeks; wk++){
      var live=[];
      season.teams.forEach(function(t){
        var p=(pts[t]||{})[wk];
        if(p!=null){ live.push([t,p]); }
      });
      for(var i=0;i<live.length;i++){
        for(var j=0;j<live.length;j++){
          if(i===j){ continue; }
          var a=teams[live[i][0]];
          if(live[i][1]>live[j][1]){ a.apW++; }
          else if(live[i][1]<live[j][1]){ a.apL++; }
          else { a.apT++; }
        }
      }
    }
  });

  var rows = Object.keys(teams).map(function(t){
    var r = teams[t];
    var games = r.w+r.l+r.t_;
    r.games = games;
    r.pct = games? (r.w+r.t_/2)/games : 0;
    r.diff = r.pf-r.pa;
    var ap = r.apW+r.apL+r.apT;
    r.apPct = ap? (r.apW+r.apT/2)/ap : 0;
    r.luck = r.pct-r.apPct;
    r.avg = mean(r.weeks);
    r.sd = sd(r.weeks);
    r.cv = r.avg? r.sd/r.avg : 0;
    r.best = r.weeks.length? Math.max.apply(null,r.weeks):null;
    r.worst = r.weeks.length? Math.min.apply(null,r.weeks):null;
    r.nSeasons = Object.keys(r.seasons).length;
    return r;
  }).filter(function(r){ return r.games>0; });
  rows.sort(function(a,b){ return b.pct-a.pct || b.pf-a.pf; });
  rows.forEach(function(r,ix){ r.rank=ix+1; });
  return rows;
}


/* ----------------------------------------------------------------- charts */
function svgOpen(w,h,label){
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label)+'" '+
         'font-family="inherit">';
}
function txt(x,y,s,o){
  o=o||{};
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'start')+'" font-size="'+
    (o.size||11)+'" fill="'+(o.fill||'var(--muted)')+'" font-weight="'+(o.w||'normal')+
    '">'+esc(s)+'</text>';
}

/* Points per week, one faint line per team with the league median drawn
   through it, so a team's shape reads against the field rather than alone. */
function chartWeekly(rows, season){
  var W=1080,H=360,L=52,R=140,T=16,B=38, IW=W-L-R, IH=H-T-B;
  var all=[]; rows.forEach(function(r){ all=all.concat(r.weeks); });
  if(!all.length){ return ''; }
  var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  var pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  var x=function(w){ return L+IW*(season.weeks<2?0.5:(w-1)/(season.weeks-1)); };
  var y=function(v){ return T+IH*(1-(v-lo)/(hi-lo)); };
  var out=[svgOpen(W,H,'Points by week')];
  var k;
  for(k=0;k<=4;k++){
    var gy=T+IH*k/4, val=hi-(hi-lo)*k/4;
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+
             '" stroke="var(--grid)"/>');
    out.push(txt(L-8,gy+4,val.toFixed(0),{a:'end'}));
  }
  for(var w=1;w<=season.weeks;w++){
    if(season.weeks<=20 || w%2===1){ out.push(txt(x(w),T+IH+16,w,{a:'middle'})); }
  }
  var med=[];
  for(w=1;w<=season.weeks;w++){
    var vals=rows.map(function(r){return r.byWeek[w];}).filter(function(v){return v!=null;}).sort(function(a,b){return a-b;});
    if(vals.length){ med.push([w, vals[Math.floor(vals.length/2)]]); }
  }
  rows.forEach(function(r){
    var pts=[];
    for(var w=1;w<=season.weeks;w++){ if(r.byWeek[w]!=null){ pts.push(x(w).toFixed(1)+','+y(r.byWeek[w]).toFixed(1)); } }
    if(pts.length){
      out.push('<polyline fill="none" stroke="var(--muted)" stroke-width="1.1" '+
               'opacity=".33" points="'+pts.join(' ')+'" class="wk" data-team="'+esc(r.team)+'"/>');
    }
  });
  if(med.length){
    out.push('<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="'+
             med.map(function(p){return x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1);}).join(' ')+'"/>');
    out.push(txt(L+IW+8, y(med[med.length-1][1])+4, 'league median',
                 {fill:'var(--accent)', w:'600'}));
  }
  out.push(txt(L+IW/2, H-6, 'Week', {a:'middle', size:12}));
  out.push('</svg>');
  return out.join('');
}

/* Scoring against consistency. The vertical axis is inverted so that up is
   steadier, which makes "good" the top-right corner on both axes. */
function chartLines(series, through, hi, lo, aria){
  var W=1080,H=320,L=52,R=140,T=16,B=38,IW=W-L-R,IH=H-T-B;
  if(hi===lo){ hi=lo+1; }
  var x=function(w){ return L+IW*(through<2?0.5:(w-1)/(through-1)); };
  var y=function(v){ return T+IH*(1-(v-lo)/(hi-lo)); };
  var out=[svgOpen(W,H,aria)];
  for(var k=0;k<=4;k++){
    var gy=T+IH*k/4;
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+
             '" stroke="var(--grid)"/>');
    out.push(txt(L-8,gy+4,((hi-(hi-lo)*k/4)*100).toFixed(0)+'%',{a:'end'}));
  }
  for(var w=1;w<=through;w++){
    if(through<=20||w%2===1){ out.push(txt(x(w),T+IH+16,w,{a:'middle'})); }
  }
  series.forEach(function(sr){
    var pts=[];
    for(var w=1;w<=through;w++){
      if(sr.v[w]!=null){ pts.push(x(w).toFixed(1)+','+y(sr.v[w]).toFixed(1)); }
    }
    if(pts.length){
      out.push('<polyline fill="none" stroke="var(--muted)" stroke-width="1.1" opacity=".32" '+
               'points="'+pts.join(' ')+'"><title>'+esc(sr.name)+'</title></polyline>');
    }
  });
  var med=[];
  for(w=1;w<=through;w++){
    var v=series.map(function(sr){return sr.v[w];}).filter(function(z){return z!=null;})
            .sort(function(a,b){return a-b;});
    if(v.length){ med.push([w,v[Math.floor(v.length/2)]]); }
  }
  if(med.length){
    out.push('<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="'+
             med.map(function(pt){return x(pt[0]).toFixed(1)+','+y(pt[1]).toFixed(1);}).join(' ')+'"/>');
    out.push(txt(L+IW+8, y(med[med.length-1][1])+4, 'league median',
                 {fill:'var(--accent)', w:'600'}));
  }
  out.push(txt(L+IW/2,H-6,'Week',{a:'middle',size:12}));
  out.push('</svg>');
  return out.join('');
}

function chartConsistency(rows){
  var W=760,H=430,L=62,R=24,T=18,B=48, IW=W-L-R, IH=H-T-B;
  var xs=rows.map(function(r){return r.avg;}), ys=rows.map(function(r){return r.sd;});
  var xlo=Math.min.apply(null,xs), xhi=Math.max.apply(null,xs);
  var ylo=Math.min.apply(null,ys), yhi=Math.max.apply(null,ys);
  var xp=(xhi-xlo)*0.12||1, yp=(yhi-ylo)*0.12||1;
  xlo-=xp; xhi+=xp; ylo-=yp; yhi+=yp;
  var x=function(v){ return L+IW*(v-xlo)/(xhi-xlo); };
  var y=function(v){ return T+IH*(v-ylo)/(yhi-ylo); };
  var out=[svgOpen(W,H,'Scoring against consistency')];
  for(var k=0;k<=4;k++){
    var gx=L+IW*k/4, gy=T+IH*k/4;
    out.push('<line x1="'+gx.toFixed(1)+'" y1="'+T+'" x2="'+gx.toFixed(1)+'" y2="'+(T+IH)+'" stroke="var(--grid)"/>');
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+'" stroke="var(--grid)"/>');
    out.push(txt(gx,T+IH+16,(xlo+(xhi-xlo)*k/4).toFixed(0),{a:'middle'}));
    out.push(txt(L-8,gy+4,(ylo+(yhi-ylo)*k/4).toFixed(0),{a:'end'}));
  }
  rows.forEach(function(r){
    out.push('<circle cx="'+x(r.avg).toFixed(1)+'" cy="'+y(r.sd).toFixed(1)+
             '" r="5" fill="var(--accent)" fill-opacity=".8"><title>'+esc(r.team)+
             ' — '+fmt(r.avg)+' avg, '+fmt(r.sd)+' sd</title></circle>');
    out.push(txt(x(r.avg)+8, y(r.sd)+4, r.team.length>22? r.team.slice(0,21)+'…':r.team,
                 {size:10.5, fill:'var(--ink)'}));
  });
  out.push(txt(L+IW/2,H-8,'Mean points per week',{a:'middle',size:12}));
  out.push('<text transform="translate(14,'+(T+IH/2)+') rotate(-90)" text-anchor="middle" '+
           'font-size="12" fill="var(--muted)">Standard deviation (lower is steadier)</text>');
  out.push('</svg>');
  return out.join('');
}

/* --------------------------------------------------------------- sections */
function seasonLabel(season){
  return Array.isArray(season)
    ? season[0].label+' to '+season[season.length-1].label
    : season.label;
}

function overview(rows, season){
  var combined=Array.isArray(season);
  if(combined){
    var best=rows[0];
    var most=rows.slice().sort(function(a,b){return b.games-a.games;})[0];
    var lucky=rows.slice().sort(function(a,b){return b.luck-a.luck;})[0];
    var unlucky=rows.slice().sort(function(a,b){return a.luck-b.luck;})[0];
    var ap=rows.slice().sort(function(a,b){return b.apPct-a.apPct;})[0];
    var cards=[
      ['Best record', best.team, best.w+'-'+best.l+'-'+best.t_+' over '+best.nSeasons+
        ' season'+(best.nSeasons===1?'':'s')],
      ['Best all-play', ap.team, fmt(ap.apPct*100,1)+'% against the whole field'],
      ['Longest served', most.team, most.games+' matches, '+most.nSeasons+' seasons'],
      ['Best served by the schedule', lucky.team,
        (lucky.luck>=0?'+':'')+fmt(lucky.luck*100,1)+' pts of win% over all-play'],
      ['Worst served', unlucky.team, fmt(unlucky.luck*100,1)+' pts of win% under all-play']
    ];
    return sect('overview','Overview','What this covers and how to read it.',
      '<p class="lead">'+esc(HOCKEY.league)+' across '+season.length+' seasons, '+
      esc(seasonLabel(season))+', with '+rows.length+' teams between them. The league '+
      'changed scoring system along the way, so this view keeps to records and rates: '+
      'everything here is read against an all-play record, what each team would have '+
      'done against every opponent every week, which is comparable when raw points are '+
      'not.</p>'+
      '<div class="cards">'+cards.map(function(c){
        return '<div class="card"><div class="label">'+esc(c[0])+'</div><div class="val">'+
               esc(c[1])+'</div><div class="why">'+esc(c[2])+'</div></div>';
      }).join('')+'</div>');
  }
  var top=rows[0];
  var most=rows.slice().sort(function(a,b){return b.pf-a.pf;})[0];
  var lucky=rows.slice().sort(function(a,b){return b.luck-a.luck;})[0];
  var unlucky=rows.slice().sort(function(a,b){return a.luck-b.luck;})[0];
  var steady=rows.slice().sort(function(a,b){return a.cv-b.cv;})[0];
  var best=rows.slice().sort(function(a,b){return b.best-a.best;})[0];
  var cards=[
    ['Top of the table', top.team, top.w+'-'+top.l+'-'+top.t_+', '+fmt(top.pf,0)+' points for'],
    ['Most points', most.team, fmt(most.pf,0)+' across '+most.games+' weeks'],
    ['Best week', best.team, fmt(best.best)+' in a single week'],
    ['Steadiest', steady.team, fmt(steady.sd)+' sd on '+fmt(steady.avg)+' a week'],
    ['Best served by the schedule', lucky.team,
      (lucky.luck>=0?'+':'')+fmt(lucky.luck*100,1)+' pts of win% over all-play'],
    ['Worst served', unlucky.team,
      fmt(unlucky.luck*100,1)+' pts of win% under all-play']
  ];
  return sect('overview','Overview',
    'What this covers and how to read it.',
    '<p class="lead">'+esc(HOCKEY.league)+', '+esc(seasonLabel(season))+', '+
    (combined? rows.length+' teams across '+season.length+' seasons'
             : season.teams.length+' teams through week '+season.weeks)+
    '. Head-to-head scoring means the fixture list '+
    'matters as much as the scoring does, so the table below is read against an '+
    'all-play record throughout: what each team would have done had it played '+
    'everyone every week.</p>'+
    '<div class="cards">'+cards.map(function(c){
      return '<div class="card"><div class="label">'+esc(c[0])+'</div><div class="val">'+
             esc(c[1])+'</div><div class="why">'+esc(c[2])+'</div></div>';
    }).join('')+'</div>');
}

function standings(rows, combined){
  /* Scoring changed completely between eras: the 2010s leagues ran about five
     points a team a week, the current ones about 280. Points for and against
     therefore cannot be summed across seasons, so the combined view drops
     them and keeps only what survives the change -- records and rates. */
  if(combined){
    var cb=rows.map(function(r){
      return '<tr><td class="name">'+esc(r.team)+'</td>'+
        '<td data-sort="'+r.rank+'">'+r.rank+'</td>'+
        '<td data-sort="'+r.nSeasons+'">'+r.nSeasons+'</td>'+
        '<td data-sort="'+r.games+'">'+r.games+'</td>'+
        '<td data-sort="'+r.pct+'">'+r.w+'-'+r.l+'-'+r.t_+'</td>'+
        '<td data-sort="'+r.pct+'">'+fmt(r.pct*100,1)+'</td>'+
        '<td data-sort="'+r.apPct+'">'+fmt(r.apPct*100,1)+'</td></tr>';
    }).join('');
    return sect('standings','Standings, all seasons',
      'Records and rates only. Points for and against are left out here because the '+
      'league changed scoring system between the 2010s and now &mdash; about five points '+
      'a team a week then against roughly 280 today &mdash; so totals from the two eras '+
      'cannot be added together. Win rates and all-play survive the change; raw points '+
      'do not.',
      '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th><th>#</th>'+
      '<th>Seasons</th><th>Games</th><th>W-L-T</th><th>Win%</th><th>All-play%</th>'+
      '</tr></thead><tbody>'+cb+'</tbody></table></div>');
  }
  var body=rows.map(function(r){
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+r.rank+'">'+r.rank+'</td>'+
      '<td data-sort="'+r.pct+'">'+r.w+'-'+r.l+'-'+r.t_+'</td>'+
      '<td data-sort="'+r.pct+'">'+fmt(r.pct*100,1)+'</td>'+
      '<td data-sort="'+r.pf+'">'+fmt(r.pf,1)+'</td>'+
      '<td data-sort="'+r.pa+'">'+fmt(r.pa,1)+'</td>'+
      '<td data-sort="'+r.diff+'" class="'+(r.diff>=0?'up':'down')+'">'+
        (r.diff>=0?'+':'')+fmt(r.diff,1)+'</td>'+
      '<td data-sort="'+r.avg+'">'+fmt(r.avg)+'</td>'+
      '<td data-sort="'+r.apPct+'">'+fmt(r.apPct*100,1)+'</td></tr>';
  }).join('');
  return sect('standings','Standings',
    'Points for and against are the weekly totals this scoring produces. All-play '+
    'win% is the same season with every team playing every other team each week.',
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th><th>#</th>'+
    '<th>W-L-T</th><th>Win%</th><th>PF</th><th>PA</th><th>Diff</th><th>Avg</th>'+
    '<th>All-play%</th></tr></thead><tbody>'+body+'</tbody></table></div>');
}

function luck(rows){
  var sorted=rows.slice().sort(function(a,b){return b.luck-a.luck;});
  var span=Math.max.apply(null,sorted.map(function(r){return Math.abs(r.luck);}))||0.01;
  var body=sorted.map(function(r){
    var wdt=46*Math.abs(r.luck)/span;
    var left=r.luck<0? 50-wdt : 50;
    var col=r.luck>=0? 'var(--accent)':'var(--warm)';
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+r.luck+'"><span class="diverge"><i style="left:'+left.toFixed(1)+
      '%;width:'+Math.max(wdt,1).toFixed(1)+'%;background:'+col+'"></i><span class="mid"></span></span></td>'+
      '<td data-sort="'+r.luck+'">'+(r.luck>=0?'+':'')+fmt(r.luck*100,1)+'</td>'+
      '<td data-sort="'+r.pct+'">'+fmt(r.pct*100,1)+'</td>'+
      '<td data-sort="'+r.apPct+'">'+fmt(r.apPct*100,1)+'</td>'+
      '<td data-sort="'+r.pf+'">'+fmt(r.pf,0)+'</td></tr>';
  }).join('');
  return sect('luck','Record against the schedule',
    'A head-to-head week pays the same for beating the best team by a point as for '+
    'beating the worst by eighty, and who you drew was never yours to choose. Green '+
    'means the record is ahead of what the scoring alone would have earned against '+
    'the whole field; warm means the fixture list has taken something.',
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th>'+
    '<th>Schedule effect</th><th>Gap</th><th>Actual win%</th><th>All-play win%</th>'+
    '<th>PF</th></tr></thead><tbody>'+body+'</tbody></table></div>');
}

function weekly(rows, season){
  return sect('weekly','Points by week',
    'Every team faintly, with the league median through the middle. A team riding '+
    'above the median most weeks and still losing is the schedule at work.',
    chartWeekly(rows, season), 'Performance');
}

function consistency(rows){
  var body=rows.slice().sort(function(a,b){return a.cv-b.cv;}).map(function(r){
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+r.avg+'">'+fmt(r.avg)+'</td>'+
      '<td data-sort="'+r.sd+'">'+fmt(r.sd)+'</td>'+
      '<td data-sort="'+r.cv+'">'+fmt(r.cv*100,1)+'</td>'+

      '<td data-sort="'+r.worst+'">'+fmt(r.worst)+'</td></tr>';
  }).join('');
  return sect('consistency','Scoring and consistency',
    'Mean weekly points against the spread around it. Coefficient of variation is '+
    'the spread as a share of the mean, which is what makes a high scorer and a low '+
    'scorer comparable on steadiness.',
    chartConsistency(rows)+
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th><th>Avg</th>'+
    '<th>SD</th><th>CV%</th><th>Best</th><th>Worst</th></tr></thead><tbody>'+
    body+'</tbody></table></div>', 'Performance');
}

function h2h(rows, season){
  var order=rows.map(function(r){return r.team;});
  var head='<tr><th>Team</th>'+order.map(function(t){
    return '<th title="'+esc(t)+'">'+esc(t.slice(0,3))+'</th>';
  }).join('')+'<th>Rec</th></tr>';
  var body=rows.map(function(r){
    var cells=order.map(function(o){
      if(o===r.team){ return '<td class="cell self">&mdash;</td>'; }
      var won=r.h2h[o]||0;
      var lost=(rows.filter(function(x){return x.team===o;})[0].h2h[r.team])||0;
      if(!won && !lost){ return '<td class="cell dim">·</td>'; }
      var cls = won>lost? 'up' : (lost>won? 'down':'dim');
      return '<td class="cell '+cls+'">'+won+'-'+lost+'</td>';
    }).join('');
    return '<tr><td class="name">'+esc(r.team)+'</td>'+cells+
      '<td>'+r.w+'-'+r.l+'-'+r.t_+'</td></tr>';
  }).join('');
  return sect('h2h','Head to head',
    'Wins and losses against each opponent in '+esc(seasonLabel(season))+
    '. Columns are the first three characters of the team name; hover for the full one.'+
    (Array.isArray(season)? ' Teams that never shared a season show a dot.' : ''),
    '<div class="scroll"><table class="h2h"><thead>'+head+'</thead><tbody>'+body+
    '</tbody></table></div>', 'Comparison');
}

function rosters(rows){
  var R=HOCKEY.rosters||{};
  if(!Object.keys(R).length){ return ''; }
  var body=rows.map(function(r){
    var d=R[r.team]; if(!d){ return ''; }
    var sk=d.skaters||[], go=d.goalies||[];
    var pts=sk.reduce(function(s,p){return s+(p.PTS||0);},0);
    var top=sk.slice().sort(function(a,b){return (b.PTS||0)-(a.PTS||0);})[0];
    var gw=go.reduce(function(s,p){return s+(p.W||0);},0);
    var gaaList=go.filter(function(p){return p.GAA;});
    var gaa=gaaList.length? mean(gaaList.map(function(p){return p.GAA;})) : null;
    return '<tr><td class="name">'+esc(r.team)+'</td>'+
      '<td data-sort="'+sk.length+'">'+sk.length+'</td>'+
      '<td data-sort="'+pts+'">'+fmt(pts,0)+'</td>'+
      '<td>'+(top? esc(top.name)+' <span class="dim">'+fmt(top.PTS,0)+'</span>':'--')+'</td>'+
      '<td data-sort="'+go.length+'">'+go.length+'</td>'+
      '<td data-sort="'+gw+'">'+fmt(gw,0)+'</td>'+
      '<td data-sort="'+(gaa==null?99:gaa)+'">'+fmt(gaa,2)+'</td></tr>';
  }).join('');
  return sect('rosters','Rosters as they stand',
    'Season totals for the players currently rostered, not what each team actually '+
    'scored with them &mdash; a player traded in last week brings his whole season here. '+
    'NHL players are named; the managers who picked them are not.',
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th><th>Skaters</th>'+
    '<th>Skater PTS</th><th>Top skater</th><th>G</th><th>Goalie W</th><th>Avg GAA</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>', 'Squad');
}

/* ---------------------------------------------------------- shared helpers */

/* Standardise a set of values, returning z-scores. Guards the degenerate
   case where every team is identical on a measure, which would otherwise
   divide by zero and take the whole chart with it. */
function zed(values){
  var got=values.filter(function(v){ return v!=null && isFinite(v); });
  if(got.length<2){ return values.map(function(){ return 0; }); }
  var m=mean(got);
  var s=Math.sqrt(got.reduce(function(a,v){ return a+(v-m)*(v-m); },0)/(got.length-1));
  if(!s){ return values.map(function(){ return 0; }); }
  return values.map(function(v){ return (v==null||!isFinite(v))?0:(v-m)/s; });
}

/* Two-component PCA by power iteration on the covariance matrix. Small
   enough matrices that anything cleverer would be wasted. */
function pca2(rowsOfFeatures){
  var n=rowsOfFeatures.length, d=rowsOfFeatures[0].length;
  var cov=[];
  for(var i=0;i<d;i++){
    cov.push([]);
    for(var j=0;j<d;j++){
      var s=0;
      for(var k=0;k<n;k++){ s+=rowsOfFeatures[k][i]*rowsOfFeatures[k][j]; }
      cov[i].push(s/(n-1||1));
    }
  }
  function mul(M,v){
    return M.map(function(row){
      return row.reduce(function(a,x,ix){ return a+x*v[ix]; },0);
    });
  }
  function norm(v){
    var L=Math.sqrt(v.reduce(function(a,x){ return a+x*x; },0))||1;
    return v.map(function(x){ return x/L; });
  }
  function top(M){
    var v=norm(M.map(function(_,ix){ return ix===0?1:0.1; }));
    for(var it=0; it<200; it++){ v=norm(mul(M,v)); }
    return v;
  }
  var p1=top(cov);
  var lam=mul(cov,p1).reduce(function(a,x,ix){ return a+x*p1[ix]; },0);
  var deflated=cov.map(function(row,a){
    return row.map(function(x,b){ return x-lam*p1[a]*p1[b]; });
  });
  var p2=top(deflated);
  return rowsOfFeatures.map(function(f){
    return [f.reduce(function(a,x,ix){ return a+x*p1[ix]; },0),
            f.reduce(function(a,x,ix){ return a+x*p2[ix]; },0)];
  });
}

function labelledScatter(points, xlab, ylab, aria, colourOf){
  if(points.length<2){ return ''; }
  var W=760,H=440,L=58,R=24,T=18,B=48,IW=W-L-R,IH=H-T-B;
  var xs=points.map(function(p){return p.x;}), ys=points.map(function(p){return p.y;});
  var xlo=Math.min.apply(null,xs), xhi=Math.max.apply(null,xs);
  var ylo=Math.min.apply(null,ys), yhi=Math.max.apply(null,ys);
  var xp=(xhi-xlo)*0.14||1, yp=(yhi-ylo)*0.14||1;
  xlo-=xp; xhi+=xp; ylo-=yp; yhi+=yp;
  var x=function(v){ return L+IW*(v-xlo)/(xhi-xlo); };
  var y=function(v){ return T+IH*(1-(v-ylo)/(yhi-ylo)); };
  var out=[svgOpen(W,H,aria)];
  for(var k=0;k<=4;k++){
    var gx=L+IW*k/4, gy=T+IH*k/4;
    out.push('<line x1="'+gx.toFixed(1)+'" y1="'+T+'" x2="'+gx.toFixed(1)+'" y2="'+(T+IH)+'" stroke="var(--grid)"/>');
    out.push('<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(L+IW)+'" y2="'+gy.toFixed(1)+'" stroke="var(--grid)"/>');
  }
  points.forEach(function(p){
    out.push('<circle cx="'+x(p.x).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" r="5.5" fill="'+
             (colourOf?colourOf(p):'var(--accent)')+'" fill-opacity=".8"><title>'+esc(p.team)+
             '</title></circle>');
    out.push(txt(x(p.x)+8, y(p.y)+4,
                 p.team.length>20?p.team.slice(0,19)+'…':p.team,
                 {size:10.5,fill:'var(--ink)'}));
  });
  out.push(txt(L+IW/2,H-8,xlab,{a:'middle',size:12}));
  out.push('<text transform="translate(14,'+(T+IH/2)+') rotate(-90)" text-anchor="middle" '+
           'font-size="12" fill="var(--muted)">'+esc(ylab)+'</text>');
  out.push('</svg>');
  return out.join('');
}

function barChart(items, aria, opts){
  opts=opts||{};
  if(!items.length){ return ''; }
  var W=1080,rowH=26,L=opts.left||230,R=opts.right||95,T=10,IW=W-L-R;
  var H=T+items.length*rowH+14;
  var vals=items.map(function(i){ return i.v; });
  var hi=Math.max.apply(null,vals), lo=Math.min.apply(null,vals);
  var base=opts.zero===false ? lo-(hi-lo)*0.35 : Math.min(0,lo);
  var out=[svgOpen(W,H,aria)];
  items.forEach(function(it,i){
    var y=T+i*rowH;
    var frac=(hi===base)?1:(it.v-base)/(hi-base);
    var len=Math.max(2, IW*Math.max(frac,0.02));
    out.push(txt(L-10,y+15, it.team.length>30?it.team.slice(0,29)+'…':it.team,
                 {a:'end',size:11.5,fill:'var(--ink)',w:'600'}));
    out.push('<rect x="'+L+'" y="'+(y+4)+'" width="'+len.toFixed(1)+'" height="15" rx="3" fill="'+
             (it.colour||(i===0?'var(--accent)':'var(--muted)'))+'" fill-opacity="'+
             (i===0?'.9':'.55')+'"/>');
    out.push(txt(L+len+8,y+16, opts.fmt?opts.fmt(it.v):fmt(it.v,1),
                 {size:11,fill:'var(--ink)'}));
  });
  out.push('</svg>');
  return out.join('');
}

/* ------------------------------------------------------------ new sections */

function powerRating(rows, season){
  /* Cumulative all-play win rate after each week: it ignores the fixture
     list entirely and updates weekly, which is as close to a power rating as
     this data supports. */
  if(Array.isArray(season)){ return ''; }
  var through=season.weeks||0;
  var series=[], any=[];
  rows.forEach(function(r){
    var w=0,n=0,v={};
    for(var wk=1; wk<=through; wk++){
      var mine=r.byWeek[wk];
      if(mine==null){ continue; }
      rows.forEach(function(o){
        if(o.team===r.team){ return; }
        var theirs=o.byWeek[wk];
        if(theirs==null){ return; }
        n++;
        if(mine>theirs){ w++; } else if(mine===theirs){ w+=0.5; }
      });
      if(n){ v[wk]=w/n; any.push(w/n); }
    }
    series.push({name:r.team, v:v});
  });
  if(!any.length){ return ''; }
  return sect('power','Power rating over time',
    'Cumulative all-play win rate as it stood after each week. Because it scores every '+
    'team against the whole field it moves on performance alone, so a team climbing here '+
    'while sliding in the table is losing to the schedule rather than to the league.',
    chartLines(series, through, Math.max.apply(null,any)+0.03,
               Math.min.apply(null,any)-0.03, 'Power rating over time'),
    'Performance');
}

function momentum(rows, season){
  /* Recent form against the season behind it. Four weeks is short enough to
     move and long enough not to be one good night. */
  if(Array.isArray(season)){ return ''; }
  var span=4;
  var items=rows.map(function(r){
    var weeks=Object.keys(r.byWeek).map(Number).sort(function(a,b){ return a-b; });
    if(weeks.length<span+2){ return null; }
    var recent=weeks.slice(-span).map(function(w){ return r.byWeek[w]; });
    var before=weeks.slice(0,-span).map(function(w){ return r.byWeek[w]; });
    if(!before.length){ return null; }
    var base=mean(before);
    return {team:r.team, v:base? (mean(recent)-base)/base*100 : 0,
            recent:mean(recent), before:base};
  }).filter(Boolean);
  if(!items.length){ return ''; }
  items.sort(function(a,b){ return b.v-a.v; });
  items.forEach(function(i){ i.colour = i.v>=0? 'var(--accent)':'var(--warm)'; });

  var body=items.map(function(i){
    return '<tr><td class="name">'+esc(i.team)+'</td>'+
      '<td data-sort="'+i.recent+'">'+fmt(i.recent,1)+'</td>'+
      '<td data-sort="'+i.before+'">'+fmt(i.before,1)+'</td>'+
      '<td data-sort="'+i.v+'" class="'+(i.v>=0?'up':'down')+'">'+
        (i.v>=0?'+':'')+fmt(i.v,1)+'%</td></tr>';
  }).join('');
  return sect('momentum','Recent form',
    'The last '+span+' weeks against everything before them, as a percentage change in '+
    'points scored. It says who is arriving at the right end of the season and who is '+
    'fading, which a season-long table cannot.',
    barChart(items,'Recent form',{zero:true,fmt:function(v){ return (v>=0?'+':'')+fmt(v,1)+'%'; }})+
    '<div class="scroll"><table class="sortable"><thead><tr><th>Team</th>'+
    '<th>Last '+span+' weeks</th><th>Before that</th><th>Change</th></tr></thead>'+
    '<tbody>'+body+'</tbody></table></div>',
    'Performance');
}

function seasonTotals(rows, season){
  if(Array.isArray(season)){ return ''; }
  var byFor=rows.slice().sort(function(a,b){ return b.pf-a.pf; })
    .map(function(r){ return {team:r.team, v:r.pf}; });
  var byDiff=rows.slice().sort(function(a,b){ return b.diff-a.diff; })
    .map(function(r){ return {team:r.team, v:r.diff,
                              colour:r.diff>=0?'var(--accent)':'var(--warm)'}; });
  return sect('totals','Points for and differential',
    'Total points scored across the season, then points scored less points conceded. '+
    'The second is the better measure of the two: a team can score heavily and still be '+
    'losing ground if it concedes more.',
    '<p class="note" style="margin:0 0 6px"><strong>Points for</strong></p>'+
    barChart(byFor,'Points for',{fmt:function(v){ return fmt(v,0); }})+
    '<p class="note" style="margin:14px 0 6px"><strong>Differential</strong></p>'+
    barChart(byDiff,'Point differential',{zero:true,fmt:function(v){ return (v>=0?'+':'')+fmt(v,0); }}),
    'Performance');
}

function shape(rows, season){
  /* Where teams sit relative to each other once the measures are put on one
     scale. Rate-based inputs only, so it still means something when seasons
     from different scoring eras are combined. */
  if(rows.length<3){ return ''; }
  var feats=[
    zed(rows.map(function(r){ return r.pct; })),
    zed(rows.map(function(r){ return r.apPct; })),
    zed(rows.map(function(r){ return r.luck; })),
    zed(rows.map(function(r){ return r.cv; }))
  ];
  var mat=rows.map(function(_,i){ return feats.map(function(f){ return f[i]; }); });
  var proj=pca2(mat);
  var points=rows.map(function(r,i){
    return {team:r.team, x:proj[i][0], y:proj[i][1], pct:r.pct};
  });
  var best=Math.max.apply(null,rows.map(function(r){ return r.pct; }));
  var worst=Math.min.apply(null,rows.map(function(r){ return r.pct; }));
  return sect('shape','Where teams sit',
    'A principal component view of four measures at once &mdash; win rate, all-play rate, '+
    'the schedule effect and week-to-week spread &mdash; reduced to two axes. The axes have '+
    'no units; what they show is which teams resemble each other. Neighbours had similar '+
    'seasons, whatever the table says. Only rates go in, so it still holds when seasons '+
    'from different scoring eras are combined.',
    labelledScatter(points,'First component','Second component','Team similarity',
      function(p){
        var t=(best===worst)?0.5:(p.pct-worst)/(best-worst);
        return 'hsl(150 45% '+(70-30*t).toFixed(0)+'%)';
      }),
    'Comparison');
}

function matchupGrid(rows, season){
  if(Array.isArray(season)){ return ''; }
  var through=season.weeks||0;
  var order=rows.map(function(r){ return r.team; });
  var result={};
  season.matchups.forEach(function(m){
    var a=m.ap>m.bp?'W':(m.ap<m.bp?'L':'T');
    result[m.a+'|'+m.w]={r:a, pf:m.ap, opp:m.b};
    result[m.b+'|'+m.w]={r:(a==='W'?'L':(a==='L'?'W':'T')), pf:m.bp, opp:m.a};
  });
  var head='<tr><th>Team</th>';
  for(var w=1;w<=through;w++){ head+='<th>'+w+'</th>'; }
  head+='<th>Rec</th></tr>';
  var body=order.map(function(t){
    var r=rows.filter(function(x){ return x.team===t; })[0];
    var cells='';
    for(var w=1;w<=through;w++){
      var d=result[t+'|'+w];
      if(!d){ cells+='<td class="cell dim">·</td>'; continue; }
      var bg=d.r==='W'?'hsl(150 45% 72%)':(d.r==='L'?'hsl(18 45% 76%)':'var(--grid)');
      cells+='<td class="cell" style="background:'+bg+';color:#10140f" title="week '+w+
             ' vs '+esc(d.opp)+', '+fmt(d.pf,1)+'">'+d.r+'</td>';
    }
    return '<tr><td class="name">'+esc(t)+'</td>'+cells+
           '<td>'+r.w+'-'+r.l+'-'+r.t_+'</td></tr>';
  }).join('');
  return sect('grid','Week by week results',
    'Every result in the season at once, a row per team. Hover a cell for the opponent '+
    'and the score. Runs of one colour are the streaks a table averages away.',
    '<div class="scroll"><table class="h2h"><thead>'+head+'</thead><tbody>'+body+
    '</tbody></table></div>',
    'Comparison');
}

/* ----------------------------------------------------------------- render */
var SECTIONS=[];
var PARTS=[];

/* Sections carry the part they belong to, so the page and its contents list
   can both be grouped from one source rather than kept in step by hand. */
function sect(id,title,note,body,part){
  part=part||'This season';
  SECTIONS.push([id,title,part]);
  var head='';
  if(PARTS[PARTS.length-1]!==part){
    PARTS.push(part);
    head='<h2 class="part">'+esc(part)+'</h2>';
  }
  return head+'<section id="'+id+'"><h3>'+esc(title)+'</h3><p class="note">'+note+'</p>'+
         body+'</section>';
}

function renderToc(){
  var groups=[], byPart={};
  SECTIONS.forEach(function(s){
    if(!byPart[s[2]]){ byPart[s[2]]=[]; groups.push(s[2]); }
    byPart[s[2]].push(s);
  });
  return groups.map(function(g){
    return '<div class="tocgroup"><span class="toclabel">'+esc(g)+'</span>'+
      byPart[g].map(function(s){
        return '<a href="#'+s[0]+'">'+esc(s[1])+'</a>';
      }).join('')+'</div>';
  }).join('');
}

var ALL='__all__';

function everySeason(){
  // Oldest first, so combined tables read in chronological order.
  return [HOCKEY.current].concat(HOCKEY.history||[])
    .slice().sort(function(a,b){ return a.label.localeCompare(b.label); });
}

function seasonByLabel(label){
  if(label===ALL){ return everySeason(); }
  var all=everySeason();
  for(var i=0;i<all.length;i++){ if(all[i].label===label){ return all[i]; } }
  return HOCKEY.current;
}

function render(label){
  var picked=seasonByLabel(label);
  var combined=Array.isArray(picked);
  var rows=analyse(picked);
  SECTIONS=[]; PARTS=[];

  /* Week numbers repeat every season, so a points-by-week chart across all of
     them would lay 2010-11 on top of 2025-26 and mean nothing. It is left out
     of the combined view rather than drawn wrong. Rosters are the current
     season's by definition. */
  /* Week numbers repeat every season, so a points-by-week chart across all of
     them would lay 2010-11 on top of 2025-26 and mean nothing. Consistency
     goes for the same reason the points columns do: a mean and a spread taken
     across two different scoring systems describe neither. */
  var html=overview(rows,picked)+standings(rows,combined)+luck(rows)+
           (combined? '' : weekly(rows,picked)+consistency(rows)+
                           powerRating(rows,picked)+momentum(rows,picked)+
                           seasonTotals(rows,picked))+
           h2h(rows,picked)+shape(rows,picked)+
           (combined? '' : matchupGrid(rows,picked))+
           (picked===HOCKEY.current? rosters(rows):'')+method(picked);
  document.getElementById('main').innerHTML=html;
  document.getElementById('toc').innerHTML=renderToc();

  if(combined){
    var matches=picked.reduce(function(n,s){ return n+s.matchups.length; },0);
    document.getElementById('subtitle').textContent=
      picked.length+' seasons, '+picked[0].label+' to '+picked[picked.length-1].label+
      ' · '+rows.length+' teams · '+matches+' matches';
  } else {
    document.getElementById('subtitle').textContent=
      picked.label+' · '+picked.teams.length+' teams · '+picked.matchups.length+
      ' matches through week '+picked.weeks;
  }
  wireSort();
}

function wireSort(){
  document.querySelectorAll('table.sortable').forEach(function(table){
    table.querySelectorAll('th').forEach(function(head,col){
      head.addEventListener('click',function(){
        var body=table.tBodies[0];
        var rs=Array.prototype.slice.call(body.rows);
        var dir=head.dataset.dir==='asc'?-1:1;
        table.querySelectorAll('th').forEach(function(o){ delete o.dataset.dir; });
        head.dataset.dir=dir===1?'asc':'desc';
        rs.sort(function(l,r){
          var a=l.cells[col]?(l.cells[col].dataset.sort!==undefined?l.cells[col].dataset.sort:l.cells[col].textContent):'';
          var b=r.cells[col]?(r.cells[col].dataset.sort!==undefined?r.cells[col].dataset.sort:r.cells[col].textContent):'';
          var x=parseFloat(a),y=parseFloat(b);
          if(!isNaN(x)&&!isNaN(y)){ return (x-y)*dir; }
          return String(a).localeCompare(String(b))*dir;
        });
        rs.forEach(function(row){ body.appendChild(row); });
      });
    });
  });
}

(function boot(){
  var sel=document.getElementById('season');
  // Newest first: the history arrives oldest-first, which read oddly with
  // the running season pinned at the top of the list.
  var all=[HOCKEY.current].concat((HOCKEY.history||[]).slice().sort(function(a,b){
    return b.label.localeCompare(a.label);
  }));
  sel.innerHTML='<option value="'+ALL+'">all seasons</option>'+
    all.map(function(s){
      return '<option value="'+esc(s.label)+'">'+esc(s.label)+'</option>';
    }).join('');
  sel.addEventListener('change',function(){ render(sel.value); });

  var themer=document.getElementById('theme');
  var modes=['auto','light','dark'], at=0;
  try{ at=Math.max(0,modes.indexOf(localStorage.getItem('hkTheme'))); }catch(e){ at=0; }
  function paint(){
    var m=modes[at];
    if(m==='auto'){ document.documentElement.removeAttribute('data-theme'); }
    else { document.documentElement.setAttribute('data-theme',m); }
    themer.textContent='theme: '+m;
    try{ localStorage.setItem('hkTheme',m); }catch(e){}
  }
  paint();
  themer.addEventListener('click',function(){ at=(at+1)%modes.length; paint(); });

  render(HOCKEY.current.label);
})();
</script>

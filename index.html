<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is It Ubadah's Last Day?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            overflow: hidden; /* Prevents scrollbars as image hits edges */
        }
        
        #answer {
            font-size: 4vw; /* Reduced font size to fit the longer sentence */
            font-weight: bold;
            letter-spacing: 2px;
            padding: 0 20px;
            margin-bottom: 30px;
            position: relative;
            z-index: 10; /* Keeps text above the floating image */
            text-shadow: 2px 2px 15px rgba(0, 0, 0, 1);
            line-height: 1.5;
        }

        #answer a {
            color: #4dff4d;
            text-decoration: none;
            word-break: break-all;
        }

        #answer a:hover {
            text-decoration: underline;
        }

        .title {
            position: absolute;
            top: 20px;
            font-size: 1.2rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 1);
        }

        #sad-ubadah {
            position: absolute;
            width: 250px; /* Fixed size for smooth bouncing logic */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            display: block; /* Always show the image now */
            z-index: 1; /* Floats behind the text */
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="title">Is it Ubadah's last day?</div>
    
    <!-- Hardcoded the new response and removed the date-checking logic -->
    <div id="answer">
        No, Ubadah exists outside of any company.<br>
        Follow him here:<br>
        <a href="https://ubadahsabbagh.com/" target="_blank">https://ubadahsabbagh.com/</a>
    </div>
    
    <img id="sad-ubadah" src="watermarked_img_10301186092833432010.jpg" alt="Sad Ubadah">

    <script>
        // Floating Animation Variables
        let imgX = Math.random() * (window.innerWidth - 250); // Start at random X
        let imgY = Math.random() * (window.innerHeight - 250); // Start at random Y
        let dx = 2; // Speed on X axis
        let dy = 2; // Speed on Y axis

        function floatImage() {
            const img = document.getElementById("sad-ubadah");
            const rect = img.getBoundingClientRect();
            
            // Reverse direction if image hits the window boundaries
            if (imgX + rect.width >= window.innerWidth || imgX <= 0) {
                dx = -dx;
            }
            if (imgY + rect.height >= window.innerHeight || imgY <= 0) {
                dy = -dy;
            }

            imgX += dx;
            imgY += dy;

            img.style.left = imgX + "px";
            img.style.top = imgY + "px";

            // Loop the animation
            requestAnimationFrame(floatImage);
        }

        // Run animation immediately on load
        floatImage();

        // Ensure image doesn't get stuck off-screen if user resizes the browser window
        window.addEventListener('resize', () => {
            const img = document.getElementById("sad-ubadah");
            const rect = img.getBoundingClientRect();
            if (imgX + rect.width > window.innerWidth) imgX = window.innerWidth - rect.width;
            if (imgY + rect.height > window.innerHeight) imgY = window.innerHeight - rect.height;
        });
    </script>
</body>
</html>

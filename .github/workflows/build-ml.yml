name: Build Music League page

# The dashboard is published as one self-contained file, but its season data
# lives in ML/data/*.json so adding a round is a small diff. This inlines the
# data back into ML/index.html whenever it changes.
#
# The daily run is a safety net, not the main event: Music League is behind a
# login, so nothing here fetches new results. If the data has not changed, the
# build is byte-identical and the job commits nothing.

on:
  push:
    branches: [main]
    paths:
      - 'ML/data/**'
      - 'ML/template.html'
      - 'tools/build_ml.py'
      - '.github/workflows/build-ml.yml'
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ml
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ML/index.html
        run: python tools/build_ml.py

      - name: Commit if the page changed
        run: |
          if git diff --quiet -- ML/index.html; then
            echo "No change to ML/index.html."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ML/index.html
          git commit -m "Rebuild Music League page from ML/data"
          # The LearnedLeague workflow pushes to this same branch, so a run
          # that overlaps one of those would otherwise fail non-fast-forward.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt); rebasing on origin/main."
            git pull --rebase origin main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
